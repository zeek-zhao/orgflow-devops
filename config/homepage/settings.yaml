# 站点外观与布局。域名相关的东西一律不写在这里：
# 卡片链接用 {{HOMEPAGE_VAR_GATEWAY_DOMAIN}} 引用 compose 注入的环境变量，
# 换域名只改 .env 的 GATEWAY_DOMAIN，不用回来改这个文件。
title: orgflow-devops
language: zh-CN
theme: dark
color: slate
headerStyle: boxed

# 两个分组各自布局：服务入口一行 3 张卡，本地文档书签一行 4 条，
# 免得 11 份文档挤成一小坨。分组名与 services.yaml / bookmarks.yaml 保持一致。
layout:
  服务入口:
    style: row
    columns: 3
  本地文档:
    style: row
    columns: 4
