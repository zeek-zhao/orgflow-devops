# 组件（官方 homepage 格式）。只放不依赖凭据的：resources 读容器自身 cgroup，
# datetime 纯前端。首页公开可访问，不放任何需要 token 的 widget。
- resources:
    label: 宿主资源
    cpu: true
    memory: true
    disk: /

- datetime:
    text_size: xl
    format:
      dateStyle: short
      timeStyle: short

# 天气 widget 已移除（M0-v2 §3.5）：原 Open-Meteo customapi 依赖外网 CDN，
# 断网会裂图/红字。首页公开可访问，只保留零外网依赖的 resources / datetime / search。

# search：纯前端搜索引擎，不依赖凭据。
- search:
    provider: duckduckgo
    target: _blank
