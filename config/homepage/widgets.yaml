# 组件。刻意只放不依赖凭据的：
#   - resources：读容器自身的 cgroup，不需要额外权限
#   - datetime：纯前端（时间）
#   - customapi：天气，直连 Open-Meteo 的免 key 端点（见下）
#   - search：纯前端，搜索引擎在浏览器侧发起
#
# 想要 Jenkins / Nexus 的健康 widget，需要在 compose 里注入 API token。
# 首页是公开站点，不这么做——那种信息放到 docs/services/*.md 的排查段里，
# 用命令现查，比把凭据摆在门口强。
#
# ── 容器版本实测（213 / of-homepage / mirror-homepage:v2.7.0，只读）──────────
#   /app/package.json                          → "version": "2.7.0"
#   /app/src/components/widgets/              → customapi datetime glances greeting
#                                               kubernetes logo longhorn openmeteo
#                                               openweathermap resources stocks
#                                               unifi_console weather
#   /app/.next/server/pages/api/widgets/openmeteo.js
#       → 后端硬编码 https://api.open-meteo.com/v1/forecast?...&current_weather=true
#         （旧版参数），URL 不在 widgets.yaml 里，既改不动也无法核对是否带 key。
#   /app/.next/server/pages/api/widgets/customapi.js
#       → 读 url 字段（缺失报 Missing Custom API URL），url/headers/key/apiKey 等
#         敏感字段不会下发到前端。
#   结论：天气走 customapi + Open-Meteo，把免 key 的 URL 直接写在配置里可核对；
#         不写 openmeteo（v2.7.0 实现与本卡指定的 current=temperature_2m 契约不符），
#         更不写 widgets.yaml 里根本不存在的 siteMonitor widget 类型。
# ───────────────────────────────────────────────────────────────────────────

- resources:
    label: 宿主资源
    cpu: true
    memory: true
    disk: /

- datetime:
    text_size: xl
    format:
      dateStyle: short
      timeStyle: short

# 天气：Open-Meteo 非商业 + <10,000 次/日 下 api.open-meteo.com 不需要 apikey。
# 当前天气走 /v1/forecast?...&current=temperature_2m,...（官方逐字，见
# docs/M0-增量需求总表.md §1 第 10 条）。URL 里没有 apikey / key / token，
# scripts/test_homepage_config.py 会逐字符断言这一点。
# 经纬度是固定的示例坐标（上海）；换城市只改 latitude / longitude。
- customapi:
    label: 天气 · Open-Meteo
    url: "https://api.open-meteo.com/v1/forecast?latitude=31.2304&longitude=121.4737&current=temperature_2m,relative_humidity_2m,weather_code&timezone=auto"
    refreshInterval: 300000
    icon: mdi-weather-partly-cloudy
    mappings:
      - field: current.temperature_2m
        label: 气温
        format: text
      - field: current.relative_humidity_2m
        label: 湿度
        format: text

- search:
    provider: duckduckgo
    target: _blank
