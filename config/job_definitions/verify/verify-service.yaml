# 每服务一个专属 verify job（JJB 循环生成 11 个）。
# 职责统一串在 verifyService step 里：部署 → healthy（deploy.sh 健康闸门内建）
# → 备份（仅 jenkins/nexus/ldap 有真卷，其余显式跳过）→ 断言备份三件套。
# 所以这里只有一个模板 + 一个服务的名字列表；新增服务时在这里加一行即可。
#
# 流水线化（#91 / REQ-M0-B2）：stage 只做「准备 / 执行」两段真实分段，
# 不把 verifyService 内部步骤拆成空 stage —— 那属于共享库重构，不在本卡范围。
- job-template:
    name: verify-{svc}
    description: "verify-{svc}：部署该服务 → 等 healthy → 备份（如支持）→ 断言备份产物。单服务运维闭环自检。"
    project-type: pipeline
    sandbox: true
    scm:
      - git:
          url: https://github.com/zeek-zhao/orgflow-devops.git
          branches: [main]
          credentials-id: github-token
          skip-tag: true
          wipe-workspace: false
    dsl: |
      @Library('orgflow-shared') _
      pipeline {{
        agent {{ label 'orgflow-docker' }}
        stages {{
          stage('准备：检出代码') {{
            steps {{
              checkout([$class: 'GitSCM',
                branches: [[name: 'main']],
                userRemoteConfigs: [[
                  url: 'https://github.com/zeek-zhao/orgflow-devops.git',
                  credentialsId: 'github-token'
                ]]])
            }}
          }}
          stage('执行：验证闭环') {{
            steps {{
              verifyService(
                service: '{svc}',
                environment: 'dev',
                dryRun: params.DRY_RUN
              )
            }}
          }}
        }}
        post {{
          success {{ echo 'verify 通过：服务={svc}' }}
          failure {{ echo 'verify 失败：服务={svc}，见上方 stage 日志（注意 verify 会真的执行恢复）' }}
        }}
      }}
    parameters:
      - bool:
          name: DRY_RUN
          default: false
          description: "只打印将执行的部署/备份动作，不实际执行"

- project:
    name: verify-services
    svc:
      - dnsmasq
      - jenkins
      - jenkins-agent
      - caddy
      - router
      - ldap
      - ldapadmin
      - dex
      - oauth2-proxy
      - homepage
      - nexus
    jobs:
      - verify-{svc}
