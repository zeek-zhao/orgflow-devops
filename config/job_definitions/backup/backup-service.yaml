- job:
    name: backup-service
    description: "M0 参数化备份：选服务 + 目标 + 保留天数"
    project-type: pipeline
    sandbox: true
    scm:
      - git:
          url: https://github.com/zeek-zhao/orgflow-devops.git
          branches: [main]
          credentials-id: github-token
          skip-tag: true
          wipe-workspace: false
    dsl: |
      @Library('orgflow-shared') _
      node('orgflow-docker') {{
        def scm = [$class: 'GitSCM',
          branches: [[name: 'main']],
          userRemoteConfigs: [[
            url: 'https://github.com/zeek-zhao/orgflow-devops.git',
            credentialsId: 'github-token'
          ]]]
        checkout(scm)
        backupService(
          service: params.SERVICE,
          target: params.BACKUP_TARGET,
          retentionDays: params.RETENTION_DAYS
        )
      }}
    parameters:
      - choice:
          name: SERVICE
          choices:
            - jenkins
            - nexus
            - ldap
            - all
          description: "要备份的服务（all=全部）"
      - choice:
          name: BACKUP_TARGET
          choices:
            - local
          description: "备份目标（M0 仅支持 local）"
      - string:
          name: RETENTION_DAYS
          default: '7'
          description: "保留天数"
