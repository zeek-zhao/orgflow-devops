- job:
    name: deploy-service
    description: "M0 参数化部署：选择一个服务，按参数拉起（共享库 withCredentials 注入敏感项）"
    project-type: pipeline
    sandbox: true
    scm:
      - git:
          url: https://github.com/zeek-zhao/orgflow-devops.git
          branches: [main]
          credentials-id: github-token
          skip-tag: true
          wipe-workspace: false
    dsl: |
      @Library('orgflow-shared') _
      pipeline {{
        agent {{ label 'orgflow-docker' }}
        options {{ timestamps() }}
        stages {{
          stage('准备：检出代码') {{
            steps {{
              checkout([$class: 'GitSCM',
                branches: [[name: 'main']],
                userRemoteConfigs: [[
                  url: 'https://github.com/zeek-zhao/orgflow-devops.git',
                  credentialsId: 'github-token'
                ]]])
            }}
          }}
          stage('执行：参数化部署') {{
            steps {{
              deployService(
                service: params.SERVICE,
                environment: params.ENV,
                dryRun: params.DRY_RUN
              )
            }}
          }}
        }}
        post {{
          success {{ echo '部署成功：SERVICE=' + params.SERVICE + ' ENV=' + params.ENV }}
          failure {{ echo '部署失败：SERVICE=' + params.SERVICE + ' ENV=' + params.ENV + '，见上方 stage 日志' }}
        }}
      }}
    parameters:
      - choice:
          name: SERVICE
          choices:
            - jenkins
            - caddy
            - router
            - ldap
            - ldapadmin
            - dex
            - oauth2-proxy
          description: "要部署的服务（nexus 已移出 compose，改用 job nexus-deploy，#46）"
      - choice:
          name: ENV
          choices:
            - dev
            - staging
            - prod
          description: "目标环境"
      - bool:
          name: DRY_RUN
          default: false
          description: "只打印不执行"
