- job:
    name: deploy-service
    description: "M0 参数化部署：选择一个服务，按参数拉起（共享库 withCredentials 注入敏感项）"
    project-type: pipeline
    sandbox: true
    scm:
      - git:
          url: https://github.com/zeek-zhao/orgflow-devops.git
          branches: [main]
          credentials-id: github-token
          skip-tag: true
          wipe-workspace: false
    dsl: |
      @Library('orgflow-shared') _
      node('orgflow-docker') {{
        def scm = [$class: 'GitSCM',
          branches: [[name: 'main']],
          userRemoteConfigs: [[
            url: 'https://github.com/zeek-zhao/orgflow-devops.git',
            credentialsId: 'github-token'
          ]]]
        checkout(scm)
        deployService(
          service: params.SERVICE,
          environment: params.ENV,
          version: params.VERSION,
          dryRun: params.DRY_RUN
        )
      }}
    parameters:
      - choice:
          name: SERVICE
          choices:
            - jenkins
            - caddy
            - router
            - ldap
            - ldapadmin
            - dex
            - oauth2-proxy
            - nexus
          description: "要部署的服务"
      - choice:
          name: ENV
          choices:
            - dev
            - staging
            - prod
          description: "目标环境"
      - string:
          name: VERSION
          default: ''
          description: "Jenkins/Nexus 镜像 tag（留空保留 Compose 默认版本）"
      - bool:
          name: DRY_RUN
          default: false
          description: "只打印不执行"
