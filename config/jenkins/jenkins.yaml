# Jenkins Configuration as Code —— M1 唯一配置真源（UI 上点出来的一律不算数）。
# 由 JCasC 插件读取（CASC_JENKINS_CONFIG=/var/jenkins_home/casc/jenkins.yaml，整目录只读挂载）。
# 敏感值全部走 env 占位（${LDAP_ADMIN_PASSWORD}/${JENKINS_AGENT_SSH_KEY}/${JENKINS_AGENT_HOST_KEY}/${JENKINS_URL}），
# 不写进仓库；私钥/host key 由 scripts/gen-jenkins-secrets.sh 生成、宿主 export 透传。
jenkins:
  systemMessage: "OrgFlow M1 —— Jenkins controller + SSH agent（全服务局域网检测）"
  # controller 不跑构建；业务 Job 都写 node('orgflow-agent')，避免凭据与构建同进程叠加权限。
  # 唯一例外：selfcheck 编排 Job（node('built-in')）——只读 /opt/orgflow/ci:ro 的 checks.tsv、
  # 只写 /reports/selfcheck:rw 的报告卷，不接触任何凭据、无 docker.sock，故放 1 个 executor。
  # 若不放开，selfcheck 会永远停在 "Waiting for next available executor on 'Jenkins'"（M2.4-P3 实测）。
  numExecutors: 1
  # 安全域：唯一一道登录 = LDAP（M0 口径，无本地管理员账号）。
  # ★ 必须写成 configurations 列表（JCasC 的 LDAP realm 没有扁平写法）。
  # ★ groupSearchFilter 用 member={0}：{0} 是用户完整 DN，groupOfNames 的 member 存的是完整 DN；
  #   cn={1} 只取用户名，匹配不到 groupOfNames（main 用 posixGroup+memberUid 才用 {1}）。
  securityRealm:
    ldap:
      configurations:
        - server: "ldap:389"
          rootDN: "dc=orgflow,dc=local"
          userSearchBase: "ou=people"
          userSearch: "uid={0}"
          groupSearchBase: "ou=groups"
          groupSearchFilter: "(&(objectClass=groupOfNames)(member={0}))"
          managerDN: "cn=admin,dc=orgflow,dc=local"
          managerPasswordSecret: "${LDAP_ADMIN_PASSWORD}"
          environmentProperties:
            - name: java.naming.referral
              value: ignore
  # 授权：jenkins-admins 全权；jenkins-dev 只读+构建+取消；匿名无任何权限。
  authorizationStrategy:
    projectMatrix:
      permissions:
        - "hudson.model.Hudson.Administer:jenkins-admins"
        - "hudson.model.Hudson.Read:jenkins-admins"
        - "hudson.model.Item.Read:jenkins-admins"
        - "hudson.model.Item.Build:jenkins-admins"
        - "hudson.model.Item.Cancel:jenkins-admins"
        - "hudson.model.Item.Workspace:jenkins-admins"
        - "hudson.model.Run.Update:jenkins-admins"
        - "hudson.model.Hudson.Read:jenkins-dev"
        - "hudson.model.Item.Read:jenkins-dev"
        - "hudson.model.Item.Build:jenkins-dev"
        - "hudson.model.Item.Cancel:jenkins-dev"
        - "hudson.model.Item.Workspace:jenkins-dev"
        # 匿名只给 Overall/Read：/jenkins/ 由 403 白屏变 302→login，但仍看不到 Job（无 Item.Read）
        - "hudson.model.Hudson.Read:anonymous"
  # SSH agent 永久节点（host key 固定 + manuallyProvided，跨容器重建不脱机）。
  nodes:
    - permanent:
        name: "orgflow-agent"
        numExecutors: 2
        remoteFS: "/home/jenkins/agent"
        labelString: "orgflow-agent"
        mode: NORMAL
        retentionStrategy: "always"
        launcher:
          ssh:
            host: "jenkins-agent"
            port: 22
            credentialsId: "agent-ssh-key"
            javaPath: "/opt/java/openjdk/bin/java"
            sshHostKeyVerificationStrategy:
              manuallyProvidedKeyVerificationStrategy:
                key: "${JENKINS_AGENT_HOST_KEY}"

unclassified:
  # 不设会在日志刷 "Jenkins URL is not set"，反代下邮件/回调链接也会错。
  location:
    url: "${JENKINS_URL}"
  # M2.3.2：Gerrit 事件源。gerrit-trigger 插件的 JCasC 支持由 GerritJcascConfigurator 提供
  # （判据 A 已实证：configuration-as-code/export 含 gerrit-trigger 段），无需 init.groovy 豁免。
  # gerritCredentialsId 优先于 gerritAuthKeyFile，直接复用凭据 gerrit-ci-ssh（私钥不落盘）。
  # ★ JCasC 符号名是 gerrit-trigger（连字符），不是 gerritTrigger；写驼峰会 BootFailure：
  #   UnknownAttributesException: Invalid configuration elements ... : gerritTrigger
  #   Available attributes 里明确列的是 gerrit-trigger。
  gerrit-trigger:
    servers:
      - name: "gerrit"
        config:
          gerritHostName: "gerrit"
          gerritSshPort: 29418
          gerritUserName: "ci-bot"
          gerritFrontEndUrl: "${GERRIT_FRONTEND_URL}"
          gerritCredentialsId: "gerrit-ci-ssh"
          # ★ Verified 回写口径（施工文档验收 11「失败不回写/Verified 不变」）：
          #   - 三种构建结果全部设 0 = gerrit-trigger 插件不碰 Verified；
          #   - Verified +1 只在 Pipeline 成功末段由 SSH review 独占回写（build-from-gerrit.Jenkinsfile）；
          #   - post.failure 只 echo、不回写 → 失败时 Change 上 Verified 保持不变，杜绝假绿。
          #   若这里给 failed 设 -1，失败构建会被插件自动打负票（change 探针实测），违反"Verified 不变"。
          gerritBuildStartedVerifiedValue: 0
          gerritBuildSuccessfulVerifiedValue: 0
          gerritBuildFailedVerifiedValue: 0

credentials:
  system:
    domainCredentials:
      - credentials:
          # agent SSH 私钥：directEntry（fileOnMaster 已废弃、JCasC 实例化不了会让 Jenkins 卡 starting）
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "agent-ssh-key"
              username: "jenkins"
              description: "orgflow-agent SSH 私钥"
              privateKeySource:
                directEntry:
                  privateKey: "${JENKINS_AGENT_SSH_KEY}"
          # LDAP 管理员口令（探活脚本 ldapsearch -y 临时文件用，不进命令行/console）
          - string:
              scope: GLOBAL
              id: "ldap-admin-password"
              secret: "${LDAP_ADMIN_PASSWORD}"
          # M2.3：ci-bot SSH 私钥——gerrit-trigger 收 patchset-created 事件 + pipeline
          # checkout/SSH review 回写 Verified。明文不入库，由 up.sh 从 secrets/ 注入。
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "gerrit-ci-ssh"
              username: "ci-bot"
              description: "Gerrit CI service account SSH key (M2.3)"
              privateKeySource:
                directEntry:
                  privateKey: "${GERRIT_CI_SSH_KEY}"
          # M2.3：registry 凭据——buildctl push + REST manifest 校验。口令走 .env 注入，不入库。
          - usernamePassword:
              scope: GLOBAL
              id: "registry-ci"
              username: "${REGISTRY_CI_USER}"
              password: "${REGISTRY_CI_PASSWORD}"
              description: "Internal registry push/verify credential (M2.3)"
          # M2.4 Phase3：评审流自检 Job 推探针 change 用（LDAP 管理员 HTTP Basic）。
          # 口令走 .env 注入，不入库；仅 selfcheck 的 verify-gerrit-review-flow 使用。
          - usernamePassword:
              scope: GLOBAL
              id: "gerrit-http"
              username: "${GERRIT_HTTP_USER:-zeek.zhao}"
              password: "${GERRIT_HTTP_PASSWORD}"
              description: "Gerrit HTTP Basic for selfcheck review-flow probe (M2.4)"

# Job as Code：21 条 Job 由以下 11 个 Job DSL 幂等生成；- file: 必须是容器内绝对路径。
# config/jenkins 是只读挂载，Job 不得往里写；不再有 globalLibraries（共享库走文件挂载）。
jobs:
  - file: /var/jenkins_home/casc/jobs/verify-service.groovy
  - file: /var/jenkins_home/casc/jobs/verify-lan-all.groovy
  - file: /var/jenkins_home/casc/jobs/verify-jenkins-agent.groovy
  # M2.3：Gerrit patchset-created 触发的 CI Job（buildkit → registry → Verified+1）
  - file: /var/jenkins_home/casc/jobs/build-from-gerrit.groovy
  # M2.4 Phase3：6 条功能级探测 Job + 自检编排 Job
  - file: /var/jenkins_home/casc/jobs/verify-public-urls.groovy
  - file: /var/jenkins_home/casc/jobs/verify-cgit-smart-http.groovy
  - file: /var/jenkins_home/casc/jobs/verify-registry-auth.groovy
  - file: /var/jenkins_home/casc/jobs/verify-jenkins-theme.groovy
  - file: /var/jenkins_home/casc/jobs/verify-status-page.groovy
  - file: /var/jenkins_home/casc/jobs/verify-gerrit-review-flow.groovy
  - file: /var/jenkins_home/casc/jobs/selfcheck.groovy

# M1 T7：全局默认深色主题；禁止用户改（JCasC 是唯一真源，UI 点的不算）。
# ★ 顶层根节点，不能嵌进 unclassified（否则静默不生效）。
# ★ theme id 先试 dark；若 JCasC 报 No such theme 换 darkSystem（"Dark (System)"）。
# ★ 生效前提是镜像已含 theme-manager + dark-theme 插件（见 services/jenkins/plugins.txt）：
#   必须"先重建镜像 → 再 reload JCasC"，缺插件时 reload 会让 Jenkins 启动失败。
appearance:
  themeManager:
    disableUserThemes: true
    theme: "dark"
