jenkins:
  systemMessage: "orgflow-devops M0 —— Jenkins 自举最小核心"
  # 内置节点不跑构建（5 类 Job 都在 orgflow-docker agent），设 0 消除安全警告 (#92)
  numExecutors: 0
  # 安全域:#87 起唯一一道登录 = LDAP。应急回退见 docs/services/jenkins.md。
  securityRealm:
    ldap:
      configurations:
        - server: ldap:389
          rootDN: dc=devops,dc=com
          userSearchBase: ou=users
          userSearch: uid={0}
          groupSearchBase: ou=groups
          groupSearchFilter: '(& (objectClass=posixGroup) (cn={1}))'
          groupMembershipStrategy:
            fromGroupSearch:
              filter: '(& (objectClass=posixGroup) (memberUid={1}))'
          managerDN: "cn=admin,dc=devops,dc=com"
          managerPasswordSecret: "${LDAP_ADMIN_PASSWORD}"
          environmentProperties:
            - name: java.naming.referral
              value: ignore
  # 授权按组(#87):jenkins-admin=全管,jenkins-dev=构建读写,其余组无权限
  authorizationStrategy:
    projectMatrix:
      permissions:
        - "hudson.model.Hudson.Administer:jenkins-admin"
        - "hudson.model.Hudson.Read:jenkins-dev"
        - "hudson.model.Item.Read:jenkins-dev"
        - "hudson.model.Item.Build:jenkins-dev"
        - "hudson.model.Item.Workspace:jenkins-dev"
        - "hudson.model.Item.Cancel:jenkins-dev"
  # agent 节点（#45）。三个 pipeline job 都写 node('orgflow-docker')，
  # 之前没有这个节点，所以那三个 job 从建起来就一直 pending。
  #
  # 为什么用「永久节点 + SSH launcher」而不是 SSH cloud：
  #   cloud 是按需拉起的，标签不可控；这里要的是一个固定 label 的节点。
  #
  # ★ host key 校验必须用 manuallyProvided，不能用 manuallyTrusted。
  #   一开始写的是 manuallyTrusted + requireInitialManualTrust=false，注释里
  #   声称「避免每次重启都得有人去点信任」。实测是错的（2026-11-01 真机）：
  #   它记的是**第一次见到的 key**，agent 容器一重建（/etc/ssh 不持久化，
  #   `ssh-keygen -A` 会重新生成）key 就变了，节点立刻离线、页面上等一个
  #   「Trust SSH Host Key」的点击，三个 pipeline job 全部 pending。
  #   症状是 agent 侧 `Connection closed ... [preauth]`，完全看不出是 host key。
  #   正解：host key 本身做成受管产物（secrets/agent_host_key，挂进容器覆盖
  #   /etc/ssh/ssh_host_ed25519_key），这里显式声明期望值，跨重建稳定。
  # 双维度视图（#116）。用 ListView + includePattern 归类，**不移动 Job** ——
  # 换成 Folder 会改 Job 路径，既有构建历史会失效。
  # 每个视图的正则都对着当前 16 个 Job 名核过，至少命中 2 条；
  # 加 Job 时记得回头看 includePattern，否则新 Job 只会出现在总览里。
  views:
    - all:
        name: "all"                       # 总览 = 默认 AllView
    - list:
        name: "动作·部署"
        includeRegex: ".*deploy.*"       # deploy-service, nexus-deploy
    - list:
        name: "动作·备份与恢复"
        includeRegex: ".*(backup|restore).*"  # backup-service, nexus-backup, restore-service
    - list:
        name: "动作·验证"
        includeRegex: "verify-.*"        # 10 个 verify-*
    - list:
        name: "动作·Nexus"
        includeRegex: ".*nexus.*"        # nexus-backup, nexus-deploy, verify-nexus
    - list:
        name: "服务·jenkins"
        includeRegex: ".*jenkins.*"      # verify-jenkins, verify-jenkins-agent
    - list:
        name: "服务·ldap-auth"
        includeRegex: ".*(ldap|dex|oauth2).*"  # verify-ldap, verify-ldapadmin, verify-dex, verify-oauth2-proxy
    - list:
        name: "服务·nexus"
        includeRegex: "^nexus-.*"        # nexus-backup, nexus-deploy（与动作·Nexus 视角不同）
  primaryView:
    all:
      name: "all"                         # 总览；判据要求显式声明，不靠默认
  nodes:
    - permanent:
        name: "orgflow-docker"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 2
        labelString: "orgflow-docker"
        mode: NORMAL
        retentionStrategy: "always"
        launcher:
          ssh:
            host: "jenkins-agent"
            port: 22
            credentialsId: "jenkins-agent-ssh"
            javaPath: "/opt/java/openjdk/bin/java"
            sshHostKeyVerificationStrategy:
              manuallyProvidedKeyVerificationStrategy:
                # 格式必须是 `算法 base64`（不带注释），由 deploy.sh / harness
                # 从 secrets/agent_host_key.pub 切前两列后 export
                key: "${JENKINS_AGENT_HOST_KEY}"
    # #116：两种 SSH 接入方式，都复用现有 secrets/agent_ssh_key 与
    # of-jenkins-agent 容器，不新增账号、不新增容器。
    #   orgflow-ssh-pre   「SSH 预接入」：静态节点，密钥与 host key 都是预置的
    #   orgflow-single    「单核」：同 launcher，numExecutors=1，独立 label
    # remoteFS 必须各不相同，否则三个节点会抢同一份 workspace。
    - permanent:
        name: "orgflow-ssh-pre"
        remoteFS: "/home/jenkins/agent-ssh-pre"
        numExecutors: 1
        labelString: "ssh-pre"
        mode: NORMAL
        retentionStrategy: "always"
        launcher:
          ssh:
            host: "jenkins-agent"
            port: 22
            credentialsId: "jenkins-agent-ssh"
            javaPath: "/opt/java/openjdk/bin/java"
            sshHostKeyVerificationStrategy:
              manuallyProvidedKeyVerificationStrategy:
                key: "${JENKINS_AGENT_HOST_KEY}"
    - permanent:
        name: "orgflow-single"
        remoteFS: "/home/jenkins/agent-single"
        numExecutors: 1
        labelString: "single-core"
        mode: NORMAL
        retentionStrategy: "always"
        launcher:
          ssh:
            host: "jenkins-agent"
            port: 22
            credentialsId: "jenkins-agent-ssh"
            javaPath: "/opt/java/openjdk/bin/java"
            sshHostKeyVerificationStrategy:
              manuallyProvidedKeyVerificationStrategy:
                key: "${JENKINS_AGENT_HOST_KEY}"
unclassified:
  globalLibraries:
    libraries:
      - name: "orgflow-shared"
        defaultVersion: "main"
        retriever:
          modernSCM:
            libraryPath: "shared-library"
            scm:
              # git 是 JCasC 已废弃的旧符号，运行时导出为 gitSource (#92)
              gitSource:
                remote: "https://github.com/zeek-zhao/orgflow-devops.git"
                credentialsId: "github-token"
  location:
    url: "${JENKINS_URL}"
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-token"
              username: "${GITHUB_USER:-zeek-zhao}"
              password: "${GITHUB_TOKEN}"
          - string:
              scope: GLOBAL
              id: "ldap-admin-password"
              secret: "${LDAP_ADMIN_PASSWORD}"
          - string:
              scope: GLOBAL
              id: "oauth2-client-secret"
              secret: "${OAUTH2_CLIENT_SECRET}"
          - string:
              scope: GLOBAL
              id: "oauth2-cookie-secret"
              secret: "${OAUTH2_COOKIE_SECRET}"
          # Nexus 管理员密码（#46）。Nexus 移出 compose 后由 job `nexus-deploy`
          # 部署并改密；job 用 withCredentials 注入，密码不出现在命令行与日志里。
          # 空值也能过 JCasC（env 变量存在但为空），此时脚本会跳过改密并告警。
          - string:
              scope: GLOBAL
              id: "nexus-admin-password"
              secret: "${NEXUS_ADMIN_PASSWORD}"
          # agent 的 SSH 私钥（#45）。
          #
          # ★ 不能用 fileOnMaster：那个 PrivateKeySource 已 @Deprecated，
          #   而且**没有 @DataBoundConstructor、也没有 @Symbol**，
          #   JCasC 根本实例化不了它，结果是 Jenkins 启动直接中断
          #   （症状是 8080 一直不 ready，日志里只有 "still starting up"）。
          #   它的 readResolve() 还会按 SECURITY-440 把文件内容读成 directEntry。
          #   所以这里直接用 directEntry。
          #
          # 私钥怎么进来：deploy.sh / harness 在 compose 之前
          #   export JENKINS_AGENT_SSH_PRIVATE_KEY="$(cat secrets/agent_ssh_key)"
          # compose 用 `environment: - JENKINS_AGENT_SSH_PRIVATE_KEY` 透传。
          # 这样私钥既不进仓库，也不进 .env（deploy.sh 有「已有 .env 绝不修改」的约定）。
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "jenkins-agent-ssh"
              username: "jenkins"
              description: "jenkins-agent 的 SSH 私钥"
              privateKeySource:
                directEntry:
                  privateKey: "${JENKINS_AGENT_SSH_PRIVATE_KEY}"
