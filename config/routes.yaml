# 路由注册数据源（路由注册服务读取此文件并渲染 Caddyfile）
#
# 域名模型：每个 route 是一个独立站点 https://<subdomain>.<gateway_domain>
#   - gateway_domain 默认取本文件，部署时由 .env 的 GATEWAY_DOMAIN 覆盖
#   - 全部站点使用 Caddy 内部 CA（local_certs），不向公网申请证书
#   - 未登录访问受保护站点会跳到 name: auth 那条路由的站点 /oauth2/start
#     （认证域名只由这一条路由决定，没有独立的 AUTH_SUBDOMAIN 变量）
#
# 改完执行 `make render`，或由 router 服务 watch 自动热加载。
#
# 注意：M0 ADR-13 起不再支持路径路由（/jenkins 这类入口已删除）。

gateway_domain: org-devops.com

routes:
  - name: jenkins
    subdomain: jenkins
    upstream: jenkins:8080
    auth: true

  - name: nexus
    subdomain: nexus
    upstream: nexus:8081

  - name: ldapadmin
    subdomain: ldapadmin
    upstream: ldapadmin:80

  # Dex 的端点挂在 issuer 路径 /dex 下（/dex/auth、/dex/token、/dex/keys）
  - name: dex
    subdomain: dex
    upstream: dex:5556

  # OAuth2 Proxy：/oauth2/* 与 /ping
  # name 必须是 auth：受保护站点的登录跳转目标就是这条路由的 subdomain
  - name: auth
    subdomain: auth
    upstream: oauth2-proxy:4180

  # 统一入口：一屏看到所有服务。放在最后，方便以后继续往下加。
  - name: homepage
    subdomain: home
    upstream: homepage:3000
