# 路由真源：host → upstream。改这里 → make routes → 30s 内新域 200，不重启 Caddy。
# 服务名用 compose 服务名（homepage 不是 home；ldapadmin 官方镜像监听 80）。
routes:
  - host: home.org-devops.local
    upstream: homepage:3000
  - host: ldapadmin.org-devops.local
    upstream: ldapadmin:80
  - host: router.org-devops.local
    upstream: router:8080
