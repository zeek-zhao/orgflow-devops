# 路由注册数据源（路由注册服务读取此文件并渲染 Caddyfile）
# 改完执行 `make render` 或由 router 服务 watch 自动热加载
listen: ":8080"

routes:
  - path: /jenkins
    upstream: jenkins:8080
    strip_prefix: false
    auth: true

  - path: /nexus
    upstream: nexus:8081
    strip_prefix: true

  - path: /ldapadmin
    upstream: ldapadmin:80
    strip_prefix: true

  - path: /auth
    upstream: oauth2-proxy:4180
    strip_prefix: true

  # Dex 的端点挂在 issuer 路径 /dex 下（/dex/auth、/dex/token、/dex/keys），不能剥前缀
  - path: /dex
    upstream: dex:5556
    strip_prefix: false
