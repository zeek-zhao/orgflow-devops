# 路由真源：subdomain → upstream。改这里 → make routes → 30s 内新域 200，不重启 Caddy。
# 域名后缀不写死：只填子域（home / ldapadmin / router），由 router 渲染时拼上
# GATEWAY_DOMAIN（来自 .env 的 DOMAIN）。改一处 DOMAIN，全链路跟随（v1.0 §6 / AC-22）。
# 服务名用 compose 服务名（homepage 不是 home；ldapadmin 官方镜像监听 80）。
routes:
  - host: home
    upstream: homepage:3000
  - host: ldapadmin
    upstream: ldapadmin:80
  - host: router
    upstream: router:8080
