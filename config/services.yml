# =============================================================================
# 服务注册表：服务名、容器名、固定 IP、启动顺序、依赖
#
# 这是**架构常量**，与 config/orgflow.yml 的差别是：改这里等于改架构
# （IP 变了、启动顺序变了），要同步 docs/30-架构/ 与 ADR-13。
# 脚本与 compose 覆盖层都从这里读，避免同一条事实写在三处。
#
# 字段：
#   name          compose 服务名（= services/<name>/compose.yml 所在目录名）
#   container     容器名（of-xxx），脚本与 job 按它找容器
#   ip            固定 IP 的**主机段**（最后一段），完整地址由 network.subnet 派生
#   start_order   串行启动序号：小的先起。编号留 10 的间隔，方便插入
#   health_wait   启动后等健康的超时秒数（默认 120）
#   compose       compose 片段相对路径
# =============================================================================

services:
  dnsmasq:
    container: of-dnsmasq
    ip: 2
    start_order: 10
    compose: services/dnsmasq/compose.yml
    why: 其余服务都把 resolver 指向它，必须最先起

  ldap:
    container: of-ldap
    ip: 22
    start_order: 20
    compose: services/ldap/compose.yml
    why: 所有认证路径的最终真源

  ldapadmin:
    container: of-ldapadmin
    ip: 23
    start_order: 30
    compose: services/ldapadmin/compose.yml
    why: 只是 LDAP 的 Web UI，LDAP 就绪后即可起

  dex:
    container: of-dex
    ip: 24
    start_order: 40
    compose: services/dex/compose.yml
    why: OIDC 提供方，依赖 LDAP 做认证

  oauth2-proxy:
    container: of-oauth2
    ip: 25
    start_order: 50
    compose: services/oauth2-proxy/compose.yml
    why: 依赖 dex 的 discovery 与 keys

  router:
    container: of-router
    ip: 11
    start_order: 60
    compose: services/router/compose.yml
    why: 渲染并灌入 Caddy 配置，必须先于 caddy 就绪

  caddy:
    container: of-caddy
    ip: 10
    start_order: 70
    compose: services/caddy/compose.yml
    why: 唯一发布端口，配置来自 router

  homepage:
    container: of-homepage
    ip: 26
    start_order: 80
    compose: services/homepage/compose.yml
    why: 统一入口，只依赖网关

  docs:
    container: of-docs
    ip: 28
    start_order: 90
    compose: services/docs/compose.yml
    why: MkDocs Material 静态站，只依赖网关

  jenkins:
    container: of-jenkins
    ip: 20
    start_order: 100
    compose: services/jenkins/compose.yml
    health_wait: 600
    why: 启动最慢（插件 + JCasC），放最后以免拖住前三层自检

  jenkins-agent:
    container: of-jenkins-agent
    ip: 27
    start_order: 110
    compose: services/jenkins-agent/compose.yml
    why: 由 controller 连入，controller 起来之后再起

# 只在需要时启动的辅助服务（compose profile: tools），不参与串行启动
tools:
  jjb:
    container: of-jjb
    compose: tools/jjb/compose.yml
    why: 一次性容器（compose run），推 Job 用

# 不在 compose 里的服务（由 job 或手工脚本部署），登记在这里只是为了让
# 「哪些服务不在启动序列里」有唯一答案。
external:
  nexus:
    container: of-nexus
    ip: 21
    why: '#46 Nexus 由 Jenkins job nexus-deploy 用 docker run 拉起，不是底座'

# 固定 IP 段内的保留位：新增服务前先看这里，别撞车
reserved_ips:
  1: 网关地址（Docker 自动占用）
  200-207: 动态分配段（ip_range）
