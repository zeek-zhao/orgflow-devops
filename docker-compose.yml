# 最小系统全栈：7 容器，单一网段 orgflow，CA 卷共享。
# 镜像全部 @sha256 锁定；宿主仅暴露 :80/:443（由 caddy），其余用隔离端口。
name: orgflow-minimal

services:
  dnsmasq:
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/dnsmasq@sha256:bd829c7b34d0f18a0a273324fb1c85cf6767b0823298d34efae6cc04afb0d1df
    container_name: of-dnsmasq
    build:
      context: services/dnsmasq
    environment:
      DOMAIN: ${DOMAIN:-org-devops.local}
      IP_CADDY: ${IP_CADDY:-192.168.90.10}
    ports:
      - "${P_DNSMASQ:-5353}:53/udp"
    networks:
      orgflow:
        ipv4_address: ${IP_DNSMASQ:-192.168.90.15}
    healthcheck:
      test: ["CMD-SHELL", "pgrep dnsmasq >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  certs-init:
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/certs-init@sha256:21656428b1a6a702700542cd94b9e44eadeeddda3ca88ad5fca8e7dadc416e3c
    container_name: of-certs-init
    build:
      context: services/certs-init
    environment:
      DOMAIN: ${DOMAIN:-org-devops.local}
      CA_DIR: /ca
    volumes:
      - ca-data:/ca
    restart: "no"
    networks:
      - orgflow

  ldap:
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/ldap@sha256:8de37539c997b80fb046570547164ae81be66a26a640afd77f520bc6f4b4cb82
    container_name: of-ldap
    build:
      context: services/ldap
    environment:
      DOMAIN: ${DOMAIN:-org-devops.local}
      BASE_DN: ${BASE_DN:-dc=orgflow,dc=local}
      LDAP_PASSWORD: ${LDAP_PASSWORD:-change-me}
    expose:
      - "389"
    networks:
      orgflow:
        ipv4_address: ${IP_LDAP:-192.168.90.13}
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1 -D cn=admin,dc=orgflow,dc=local -w change-me -b dc=orgflow,dc=local >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/caddy@sha256:8195c8fd3319118f70633a4fa776eb6a5682c2fd6c9f8ae31e1d08972c01e9b8
    container_name: of-caddy
    build:
      context: services/caddy
    environment:
      DOMAIN: ${DOMAIN:-org-devops.local}
      CA_DIR: /ca
      PUBLIC_PORT: ${PUBLIC_PORT:-18081}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "2019:2019"
      # 公网入口：Funnel 边缘终止 TLS 后转发到此纯 HTTP 端口
      - "${PUBLIC_PORT:-18081}:18081"
    volumes:
      - ca-data:/ca:ro
    depends_on:
      - certs-init
    networks:
      orgflow:
        ipv4_address: ${IP_CADDY:-192.168.90.10}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  homepage:
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/homepage@sha256:bdace56a623cdc1f910765fcd47f5962ddd99c93d567c0e1d2fdc00e069afa48
    container_name: of-homepage
    build:
      context: services/homepage
    environment:
      BOOKMARKS: /etc/homepage/bookmarks.yaml
    volumes:
      - ./config/bookmarks.yaml:/etc/homepage/bookmarks.yaml:ro
    depends_on:
      - caddy
    networks:
      orgflow:
        ipv4_address: ${IP_HOMEPAGE:-192.168.90.11}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:3000/\")'"]
      interval: 5s
      timeout: 3s
      retries: 10

  ldapadmin:
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/ldapadmin@sha256:f5728afbdc4788d838c857f85813539b3f61be1e03363e421d7d89e22046c4f6
    container_name: of-ldapadmin
    build:
      context: services/ldapadmin
    environment:
      LDAP_HOST: ldap
      BASE_DN: ${BASE_DN:-dc=orgflow,dc=local}
    depends_on:
      - ldap
      - caddy
    networks:
      orgflow:
        ipv4_address: ${IP_LDAPADMIN:-192.168.90.12}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  router:
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/router@sha256:4e49d848619ce9fe8d39dbf185385598b94af003add1a1296ebb03cf03cf6ee9
    container_name: of-router
    build:
      context: services/router
    environment:
      ROUTES: /etc/router/routes.yaml
      CADDY_ADMIN: http://caddy:2019
    volumes:
      - ./config/routes.yaml:/etc/router/routes.yaml:ro
      - ca-data:/ca:ro
    depends_on:
      - caddy
      - homepage
      - ldapadmin
    networks:
      orgflow:
        ipv4_address: ${IP_ROUTER:-192.168.90.14}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:8080/healthz\")'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ca-data:

networks:
  orgflow:
    driver: bridge
    ipam:
      config:
        - subnet: ${NET_SUBNET:-192.168.90.0/24}
