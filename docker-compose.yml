# 最小系统全栈：7 容器，单一网段 orgflow，CA 卷共享。
# 镜像全部对齐 main 分支同款：官方 mirror-* / main CI 产物，@sha256 锁定；
# 本仓不再基于 ubuntu 自建镜像（无 build 段），配置以卷挂载注入。
# 宿主仅暴露网关端口（由 caddy），其余用隔离端口。
name: orgflow-minimal

services:
  dnsmasq:
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/dnsmasq@sha256:9f1a5959399d1ff65e258a6f2f477c2430f9d9851764dce16b7779579c3d32f6
    container_name: of-dnsmasq
    restart: unless-stopped
    environment:
      GATEWAY_DOMAIN: ${DOMAIN:-org-devops.local}
      GATEWAY_IP: ${IP_CADDY:-192.168.90.10}
      DNSMASQ_LISTEN_IP: ${IP_DNSMASQ:-192.168.90.15}
    ports:
      - "${P_DNSMASQ:-5353}:53/udp"
    networks:
      orgflow:
        ipv4_address: ${IP_DNSMASQ:-192.168.90.15}
    healthcheck:
      test: ["CMD-SHELL", "dig +short +time=2 +tries=1 home.$$GATEWAY_DOMAIN @$$(hostname -I | cut -d' ' -f1) | grep -q ."]
      interval: 5s
      timeout: 3s
      retries: 10

  certs-init:
    # main 做法：复用 router:24.04-v1 跑内部 CA 签发脚本（含 openssl/bash）
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/router@sha256:e5fd71d1cd7cec5068a24ce1165e35587856e2cafe7ca2e772a3b50944f9fe87
    container_name: of-certs-init
    environment:
      DOMAIN: ${DOMAIN:-org-devops.local}
      CA_DIR: /ca
    volumes:
      - ca-data:/ca
      - ./services/certs-init/gen-ca.sh:/gen-ca.sh:ro
    entrypoint: ["/bin/bash", "/gen-ca.sh"]
    restart: "no"
    networks:
      - orgflow

  ldap:
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/mirror-openldap@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
    container_name: of-ldap
    restart: unless-stopped
    # --copy-service：osixia 启动会 chown/改写 bootstrap LDIF；先复制到可写 run 目录，
    # 避免对只读挂载的 50-users.ldif chown 失败（否则 status 1 起不来）。
    entrypoint: ["/container/tool/run", "--copy-service"]
    environment:
      LDAP_ORGANISATION: OrgFlow
      LDAP_DOMAIN: ${LDAP_DOMAIN:-orgflow.local}
      LDAP_ADMIN_PASSWORD: ${LDAP_PASSWORD:-change-me}
      # 健康探针用：osixia 不把 base_dn/admin_dn 传给进程，需显式注入
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=orgflow,dc=local}
      LDAP_ADMIN_DN: ${LDAP_ADMIN_DN:-cn=admin,dc=orgflow,dc=local}
      LDAP_TLS: "false"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./config/ldap/50-users.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-users.ldif:ro
    expose:
      - "389"
    networks:
      orgflow:
        ipv4_address: ${IP_LDAP:-192.168.90.13}
    healthcheck:
      test: ["CMD-SHELL", "printf '%s' \"$$LDAP_ADMIN_PASSWORD\" | ldapsearch -x -H ldap://127.0.0.1 -D \"$$LDAP_ADMIN_DN\" -y /dev/stdin -b \"$$LDAP_BASE_DN\" -s base >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/mirror-caddy@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    container_name: of-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-org-devops.local}
      PUBLIC_PORT: ${PUBLIC_PORT:-18081}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "2019:2019"
      # 公网入口：Funnel 边缘终止 TLS 后转发到此纯 HTTP 端口
      - "${PUBLIC_PORT:-18081}:18081"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ca-data:/ca:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
    networks:
      orgflow:
        ipv4_address: ${IP_CADDY:-192.168.90.10}
    healthcheck:
      # 官方 caddy:2 镜像无 curl，用 wget（busybox）探测 admin。
      # admin 绑内网固定 IP（公网不可达、容器网可达），探针用该 IP 而非 127.0.0.1。
      test: ["CMD", "wget", "--spider", "-q", "http://192.168.90.10:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 10

  homepage:
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/mirror-homepage@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
    container_name: of-homepage
    restart: unless-stopped
    environment:
      # 白名单与网关域名全部来自 .env，无写死域名（v1.0 §6）
      HOMEPAGE_ALLOWED_HOSTS: home.${DOMAIN:-org-devops.local}${PUBLIC_HOST:+,${PUBLIC_HOST}}
      HOMEPAGE_VAR_GATEWAY_DOMAIN: ${DOMAIN:-org-devops.local}
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./config/homepage:/app/config
    depends_on:
      - caddy
    networks:
      orgflow:
        ipv4_address: ${IP_HOMEPAGE:-192.168.90.11}
    healthcheck:
      # 官方 homepage 有 node（运行时），用它探测；Host 用白名单内子域。
      test: ["CMD-SHELL", "node -e \"require('http').get({host:'127.0.0.1',port:3000,path:'/',headers:{Host:'home.${DOMAIN:-org-devops.local}'}},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10

  ldapadmin:
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/mirror-phpldapadmin@sha256:d112b82be1336f91e028b0348755133fda333992355b533419355a65c32ff9ad
    container_name: of-ldapadmin
    restart: unless-stopped
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap
      PHPLDAPADMIN_HTTPS: "false"
    depends_on:
      - ldap
      - caddy
    networks:
      orgflow:
        ipv4_address: ${IP_LDAPADMIN:-192.168.90.12}
    healthcheck:
      # osixia/phpldapadmin 自带 php，监听 80（不是自建版的 8080）
      # osixia phpldapadmin 的 / 会 302→/index.php→/ 循环；不跟随重定向，按「收到 <500 响应即存活」判定
      # 健康探针：osixia 的 / 会 302 循环，不跟随重定向，收到任意 HTTP 响应即存活
      test: ["CMD", "php", "-r", "$$c=stream_context_create(['http'=>['follow_location'=>0,'timeout'=>3]]);exit(@fopen('http://127.0.0.1/','r',false,$$c)?0:1);"]
      interval: 5s
      timeout: 3s
      retries: 10

  router:
    # 保留最小底座的路由注册 API（main 的 router 是 Caddyfile 渲染器，功能不同）；
    # 复用 main CI 产物 router:24.04-v1（内含 python3），仅挂载 server.py，不在本仓自建。
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/router@sha256:e5fd71d1cd7cec5068a24ce1165e35587856e2cafe7ca2e772a3b50944f9fe87
    container_name: of-router
    restart: unless-stopped
    entrypoint: ["python3", "/app/server.py"]
    environment:
      ROUTES: /etc/router/routes.yaml
      # admin 绑内网固定 IP，Host 头须匹配该 IP（用容器名 caddy 会被 403 host not allowed）
      CADDY_ADMIN: http://192.168.90.10:2019
      # routes.yaml 的子域由 router 渲染时拼上此后缀（来自 .env 的 DOMAIN）
      GATEWAY_DOMAIN: ${DOMAIN:-org-devops.local}
    volumes:
      - ./services/router/server.py:/app/server.py:ro
      - ./config/routes.yaml:/etc/router/routes.yaml:ro
      - ca-data:/ca:ro
    depends_on:
      - caddy
      - homepage
      - ldapadmin
    networks:
      orgflow:
        ipv4_address: ${IP_ROUTER:-192.168.90.14}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request;urllib.request.urlopen(\"http://127.0.0.1:8080/healthz\")'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ca-data:
  ldap_data:
  ldap_config:

networks:
  orgflow:
    driver: bridge
    ipam:
      config:
        - subnet: ${NET_SUBNET:-192.168.90.0/24}
