# =============================================================================
# orgflow-devops 主编排入口（M0 重构，2026-11-21）
#
# 结构变了：每个服务一份片段，放在自己目录下 services/<svc>/compose.yml。
# 这个文件只做三件事：
#   1. 定义共享网络与卷；
#   2. include 全部服务片段（compose 2.20+ 的 include）；
#   3. 给 `docker compose -f docker-compose.yml` 一个稳定的入口。
#
# 为什么拆：改一个服务只动它自己那份文件；服务清单、固定 IP、容器名在
# config/services.yml 里登记，脚本按 start_order 串行启动（bash scripts/30-up-serial.sh）。
#
# ⚠ 变量来源：不再有 .env。`make deploy` 会先渲染 out/runtime.env，
#   compose 的 ${VAR} 全部从那里取。直接跑 docker compose 时请带
#   --env-file out/runtime.env（Makefile 已经这么做了）。
# =============================================================================

name: orgflow-devops

include:
  - services/dnsmasq/compose.yml
  - services/ldap/compose.yml
  - services/ldapadmin/compose.yml
  - services/dex/compose.yml
  - services/oauth2-proxy/compose.yml
  - services/router/compose.yml
  - services/caddy/compose.yml
  - services/certs-init/compose.yml
  - services/homepage/compose.yml
  - services/docs/compose.yml
  - services/jenkins/compose.yml
  - services/jenkins-agent/compose.yml
  - tools/jjb/compose.yml

networks:
  # 网络名与网段来自 config/orgflow.yml（渲染进 out/runtime.env）
  orgflow:
    name: ${NETWORK_NAME:-orgflow}
    ipam:
      driver: default
      config:
        # ip_range 必须与 subnet 同属一个 config 对象：写成两个列表项会被 daemon
        # 拒绝（invalid ip-range ... parent subnet invalid），而 `docker compose config`
        # 的 schema 校验发现不了，只有真正 network create 才报错。
        - subnet: ${NETWORK_SUBNET}
          ip_range: ${NETWORK_IP_RANGE}

volumes:
  jenkins_home:
  caddy_data:
  ldap_data:
  ldap_config:
  # ★ 保留声明但 compose 里没有服务使用（#46：nexus 移出 compose）。
  # 留着是为了让卷名继续由 compose 项目名决定（orgflow-devops_nexus_data），
  # 与 scripts/lib 里登记的卷名对齐 —— 卷名一旦漂移，备份脚本会备份一个空卷
  # 而真正的数据在另一个卷里，**静默出错**。
  nexus_data:
  docs_site:
  # 站点叶子证书卷：router 现签、caddy 只读，两边挂同一个卷。
  # 不放宿主机目录是因为宿主机可能没有 secrets/ca（干净 clone），
  # compose 会把缺失的 bind 建成 root 属主空目录，之后脚本写不进去。
  ca_sites:
