# 镜像标识表（r5 §2：M1 改「内容哈希」口径，替代不可靠的 CI digest 回填链路）
# 字段: service / tag / imageId / upstreamDigest / contextSha256
# certs-init 复用 router，不单独构建。
# M0 六项（homepage/caddy/ldap/ldapadmin/dnsmasq/router/certs-init）：
#   tag=orgflow/m0-<svc>:v2 不变；imageId 保留历史构建 64hex；upstreamDigest=Dockerfile FROM 的基底 digest。
# M1 两项（jenkins/jenkins-agent）：
#   tag=orgflow/m<阶段>-<svc>:ctx-<12>（12 = contextSha256 前 12 位，compose 直接引用此 tag）；
#   M2.2 P1-3 命名统一：M1(jenkins*) 用 m1、M2(cgit/registry) 用 m2，与 GHCR 路径对齐。
#   imageId="-"（构建产物 ID 每次随机，无标识价值，不再使用）；
#   contextSha256=scripts/image-hash.sh <svc> 的输出（Dockerfile + 其 COPY 真源文件的内容哈希，64hex，为本方案主标识）。
#   改 Dockerfile/plugins.txt 后必须跑 make images-hash 更新本列与 tag，并同步 compose；--mode=lock 会强校验。
