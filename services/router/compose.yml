# router：路由注册服务（#61）。读取 config/routes.yaml 渲染 Caddyfile 并热加载，
# 同时把 out/ca/ 下的根证书与安装脚本作为 ca.<domain> 的内容源。
#
# 它必须在 caddy 之前就绪：caddy 启动即读 out/Caddyfile，配置不在就起不来。
#
# 证书：只有根证书 config/ca/orgflow-ca.crt 入库；CA 私钥与每个子域的叶子证书在
# secrets/ca/（gitignore），运行期加路由时从这里现签，caddy 挂的是同一份目录。
services:
  router:
    build:
      context: ../../services/router
      tags: ["orgflow/router:24.04-v1"]
    container_name: of-router
    restart: unless-stopped
    environment:
      - CADDY_ADMIN_URL=http://caddy:2019
      - ROUTES_FILE=/app/config/routes.yaml
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN}
    volumes:
      # 注册 API(#61) 要写 routes.yaml，config 不再只读 —— routes.yaml 仍是唯一真源
      #
      # 上下文写 ../.. 而不是 ./config：compose include 的片段会把相对路径解析成
      # 「片段目录」，于是 ./config 变成 services/router/config（那个目录是快照样本），
      # 容器里 /app/config/routes.yaml 不存在 → router 一直 unhealthy → 整栈起不来。
      # 这两行与 build.context 用同一个锚点（仓根），两种调用方式下都对。
      - ../../config:/app/config
      - ../../out:/app/out
      # 运行期加路由时要现场补签叶子证书（scripts/lib/site_certs.py 只有一份实现），
      # 所以要把 config/ca 与签发脚本都挂进来；router 原来只读 routes.yaml/Caddyfile。
      #
      # 注意 /app/scripts/lib 是**独立挂载**、不是整仓 scripts：router 只需要这一个
      # 模块，多挂一点就多一个「容器里看到宿主代码」的歧义面。
      - ../../config/ca:/app/config/ca
      # CA 私钥与叶子证书在 secrets/ca（不进 git）；只读挂载，router 只签不删。
      - ../../secrets/ca:/app/secrets/ca
      - ../../scripts/lib/site_certs.py:/app/scripts/lib/site_certs.py:ro
    expose:
      - "8090"
    depends_on:
      dnsmasq:
        condition: service_healthy
    dns:
      - ${IP_DNSMASQ}
    networks:
      orgflow:
        ipv4_address: ${IP_ROUTER}
    healthcheck:
      # 除了 healthz，还要确认挂进来的 routes.yaml 真在容器里：早先片段里写的是
      # `./config`，被 compose 按片段目录解析成 services/router/config（快照样本），
      # 容器里没有 routes.yaml —— 日志只报 `[router] watch error: No such file`。
      # 只查 healthz 会漏掉「进程活着但配置没挂进来」这一层。
      test:
        - CMD-SHELL
        - test -s /app/config/routes.yaml && python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
