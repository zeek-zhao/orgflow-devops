# dex：OIDC 提供方，后端直接用 LDAP 认证
#
# issuer / redirectURI 必须是浏览器可达的绝对地址，由 scripts/10-render-config.sh
# 按 gateway.domain 渲染到 out/dex/config.yaml。
#
# ⚠ 只挂单个文件，不要挂整个目录：dex 以 uid 1001 运行，它的 entrypoint 会先
#   chdir 到 /etc/dex 再 fork gomplate。整目录挂载会把镜像里 1001:1001 / 0755 的
#   /etc/dex 换成宿主目录，权限一变就 chdir 失败，报出来却是
#   "fork/exec /usr/local/bin/gomplate: permission denied"。
services:
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1@sha256:bc7cfce7c17f52864e2bb2a4dc1d2f86a41e3019f6d42e81d92a301fad0c8a1d # lock: dex
    container_name: of-dex
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD}
      - OAUTH2_CLIENT_SECRET=${OAUTH2_CLIENT_SECRET}
    volumes:
      - ../../out/dex/config.yaml:/etc/dex/config.yaml:ro
    expose:
      - "5556"
    depends_on:
      ldap:
        condition: service_healthy
      dnsmasq:
        condition: service_healthy
    dns:
      - ${IP_DNSMASQ}
    networks:
      orgflow:
        ipv4_address: ${IP_DEX}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5556/dex/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
