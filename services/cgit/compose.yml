# cgit（M2.1 自建镜像）：Gerrit 裸库的只读 Web 视图，固定 IP .19，不发布宿主端口。
# 公网经 Caddy :443 的 /cgit/* 路径前缀反代（见 config/routes.yaml + Caddyfile）。
# 镜像由 CI 出 ctx-<12> 内容 tag（image-hash.sh），tag 与 tests/images.lock 一致。
services:
  cgit:
    image: ${IMAGE_CGIT:-orgflow/m1-cgit:ctx-e63757ae774e}
    pull_policy: missing
    container_name: ${CONTAINER_PREFIX:-of}-cgit
    labels:
      org.of.fp: ${FP_VALUE:-}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      GIT_ROOT: /var/gerrit/git
    volumes:
      # Gerrit 裸库目录只读共享（Gerrit 容器写，cgit 只读）
      - gerrit_git:/var/gerrit/git:ro
    expose:
      - "80"
    networks:
      orgflow:
        ipv4_address: ${IP_CGIT:-192.168.90.19}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  gerrit_git:
    external: true
    name: ${GERRIT_GIT_VOLUME:-orgflow-minimal_gerrit_git}

networks:
  orgflow:
    external: true
    name: ${ORG_NETWORK:-orgflow-minimal_orgflow}
