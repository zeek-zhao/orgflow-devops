# cgit 前端 nginx：Web 浏览交给 cgit.cgi，git clone/fetch 交给 git-http-backend，监听容器内 80。
# 公网入口 Caddy :443 handle_path /cgit/* 反代到此（前缀由 Caddy 剥掉，cgit 靠 virtual-root 重建链接）。
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    charset utf-8;

    # smart-http clone（M2.1 复核）：cgit.cgi 只做 Web 浏览，不处理 git 传输协议。
    # info/refs 与 git-upload-pack 必须由 git-http-backend 处理，否则返回 text/html，
    # git clone 报 "is this a git repository?"。Caddy 已剥掉 /cgit 前缀，这里 $uri 即
    # "/<repo>.git/info/refs"，直接作为 PATH_INFO 传给 backend。
    # GIT_PROJECT_ROOT 指向 Gerrit 裸库只读挂载卷；GIT_HTTP_EXPORT_ALL 允许导出（裸库无
    # git-daemon-export-ok 标记）。
    location ~ ^/.+\.git/(info/refs|git-upload-pack)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param GIT_PROJECT_ROOT /var/gerrit/git;
        fastcgi_param GIT_HTTP_EXPORT_ALL 1;
        fastcgi_param QUERY_STRING $query_string;
        # socket 放 /tmp（uid 1000 可写；/run 为 root 所有，非 root 无法 bind）。
        fastcgi_pass unix:/tmp/fcgiwrap.socket;
    }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/lib/cgit/cgit.cgi;
        fastcgi_param QUERY_STRING $query_string;
        # cgit 靠 PATH_INFO 解析 "<repo>/<page>" 路径；$uri 已由 Caddy 剥掉 /cgit 前缀。
        fastcgi_param PATH_INFO $uri;
        # socket 放 /tmp（uid 1000 可写；/run 为 root 所有，非 root 无法 bind）。
        fastcgi_pass unix:/tmp/fcgiwrap.socket;
    }
}
