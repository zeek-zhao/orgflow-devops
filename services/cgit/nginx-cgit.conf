# cgit 前端 nginx：所有请求交给 fcgiwrap 跑 cgit，监听容器内 80。
# 公网入口 Caddy :443 handle_path /cgit/* 反代到此（前缀会由 Caddy 剥掉，cgit 靠 virtual-root 重建链接）。
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    charset utf-8;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/lib/cgit/cgit.cgi;
        fastcgi_param QUERY_STRING $query_string;
        # socket 放 /tmp（uid 1000 可写；/run 为 root 所有，非 root 无法 bind）。
        fastcgi_pass unix:/tmp/fcgiwrap.socket;
    }
}
