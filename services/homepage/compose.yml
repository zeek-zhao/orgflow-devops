# Homepage 统一面板：官方 gethomepage/homepage（main 同款），隔离端口 8082，固定 IP .11
services:
  homepage:
    image: ${IMAGE_HOMEPAGE:-ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/mirror-homepage@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f}
    pull_policy: never
    container_name: ${CONTAINER_PREFIX:-of}-homepage
    labels:
      org.of.fp: ${FP_VALUE:-}
    environment:
      # 白名单与网关域名全部来自 .env（GATEWAY_DOMAIN 即 DOMAIN，PUBLIC_HOST 为可选公网入口），
      # 无任何写死域名；改一处 DOMAIN 全链路跟随（v1.0 §6）。
      # 白名单：公网入口HOST + localhost/127（内网探测），删除 home.<domain> 子域写法（M0-v2 C-1/§3.5）
      HOMEPAGE_ALLOWED_HOSTS: ${PUBLIC_HOST:-localhost},localhost,127.0.0.1
      # 域名入口卡 href 的占位变量（services.yaml 的 {{HOMEPAGE_VAR_PUBLIC_HOST}}）
      HOMEPAGE_VAR_PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PUID: "1000"
      PGID: "1000"
    ports:
      - "${P_HOMEPAGE:-8082}:3000"
    volumes:
      - ../../config/homepage:/app/config
    networks:
      orgflow:
        ipv4_address: ${IP_HOMEPAGE:-192.168.90.11}
    healthcheck:
      # ${DOMAIN:-...} 由 compose 解析时注入字面域名；node 拿到的是最终 Host，无需容器环境变量。
      test: ["CMD-SHELL", "node -e \"require('http').get({host:'127.0.0.1',port:3000,path:'/',headers:{Host:'localhost'}},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  orgflow:
    external: true
    name: ${ORG_NETWORK:-orgflow-minimal_orgflow}
