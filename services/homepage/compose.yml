# homepage：统一入口，一屏看到所有服务
#
# HOMEPAGE_ALLOWED_HOSTS 必须由域名驱动：homepage 精确校验 Host 头，
# 写死某个域名后换域名访问会直接 400，而报错只说 "host not allowed"，
# 看不出是配置还是路由问题。
#
# 两种写法都要列：非 443 端口访问时 Host 头带端口（home.x:8443），
# 只列不带端口的会 400 —— 而 400 和「服务没起来」在浏览器里长得一样。
services:
  homepage:
    image: gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f # lock: homepage
    container_name: of-homepage
    restart: unless-stopped
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=home.${GATEWAY_DOMAIN},home.${GATEWAY_DOMAIN}:${GATEWAY_HTTPS_PORT}
      # 卡片里的链接用 {{HOMEPAGE_VAR_GATEWAY_DOMAIN}} 引用，换域名不用改 yaml
      - HOMEPAGE_VAR_GATEWAY_DOMAIN=${GATEWAY_DOMAIN}
      - PUID=1000
      - PGID=1000
    volumes:
      # 不挂 :ro —— homepage 默认把运行日志写到 config/logs 下，只读会起不来。
      # 用户自备的卡片（docker.yaml / kubernetes.yaml 等）放 ./out/dashboard（见 orgflow.yml
      # 的 network.user_data），仓库根只留模板；日志与用户卡片同在这里，故不能整卷 :ro。
      - ../../config/homepage:/app/config
      - ../../out/dashboard:/app/config/userdata
      # homepage 往 config/logs 写日志；不把 logs 固定到 out/ 时它会落到宿主
      # config/homepage/logs（git 工作树里凭空多一个目录），跑测试的人会以为
      # 代码变了。out/ 是运行时产物目录，已经在 .gitignore 里。
      - ../../out/homepage-logs:/app/config/logs
    expose:
      - "3000"
    depends_on:
      dnsmasq:
        condition: service_healthy
    dns:
      - ${IP_DNSMASQ}
    networks:
      orgflow:
        ipv4_address: ${IP_HOMEPAGE}
    healthcheck:
      # 用 node 自检：这个镜像里不一定有 curl/wget，但 node 一定在（它就是运行时）。
      # 判据是「<500 就算起来了」而不是「==200」：探针从 127.0.0.1 发，Host 头不在
      # 白名单里，正常返回 400 —— 那 400 恰好证明 HTTP 服务是活的。
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3000,path:'/'},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
