# jenkins：controller。权限走 LDAP-only realm（#86），没有本地管理员账号。
#
# 镜像说明（#44 / #90）：上游 jenkins/jenkins 不带插件，pipeline job 与 JCasC 都用不了。
# 插件清单在 services/jenkins/plugins.txt。改完要等 main 的 Images 工作流构建、
# make images-pin 回写 digest 之后，213 才吃得到新镜像。
# 213 一律 USE_GHCR=1，拉 GHCR 上由 images.yml 构建的同一份；
# digest 引用时 up/deploy 必须 --no-build，否则报
# refusing to create a tag with a digest reference（见 Makefile）。
services:
  jenkins:
    build:
      context: ../../services/jenkins
      tags: ["orgflow/jenkins:24.04-v1"]
    container_name: of-jenkins
    restart: unless-stopped
    environment:
      - JENKINS_OPTS=-Djava.util.logging.config.file=/var/jenkins_home/logging.properties
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc/jenkins.yaml
      - JENKINS_URL=${JENKINS_URL}
      - JENKINS_ADMIN_ID=${JENKINS_ADMIN_ID}
      - GITHUB_USER=${GITHUB_USER}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD}
      - OAUTH2_CLIENT_SECRET=${OAUTH2_CLIENT_SECRET}
      - OAUTH2_COOKIE_SECRET=${OAUTH2_COOKIE_SECRET}
      # agent 的 SSH 私钥（#45）：由 scripts/lib 在 compose 之前从
      # secrets/agent_ssh_key 读出来 export，这里只做透传（不带 = 即从宿主环境取值）。
      # JCasC 用 directEntry 引用它 —— 私钥既不进仓库，也不进配置文件。
      - JENKINS_AGENT_SSH_PRIVATE_KEY
      # agent 的 sshd host key 公钥（同理由：从宿主环境透传）。
      # JCasC 用 manuallyProvidedKeyVerificationStrategy 声明期望值，host key 一变
      # 就连不上 —— 所以必须是 secrets/ 里那个固定的 key，不能靠首次自动信任。
      - JENKINS_AGENT_HOST_KEY
      # Nexus 管理员密码（#46）：Nexus 由 job `nexus-deploy` 部署并改密。
      # 密码经 JCasC 落成 Jenkins 凭据 `nexus-admin-password`，job 里 withCredentials 注入，
      # 不出现在命令行与日志里。留空则 job 跳过改密。
      - NEXUS_ADMIN_ID=${NEXUS_ADMIN_ID}
      - NEXUS_ADMIN_PASSWORD=${NEXUS_ADMIN_PASSWORD}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./config/jenkins.yaml:/var/jenkins_home/casc/jenkins.yaml:ro
    expose:
      - "8080"
    depends_on:
      dnsmasq:
        condition: service_healthy
    dns:
      - ${IP_DNSMASQ}
    networks:
      orgflow:
        ipv4_address: ${IP_JENKINS}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
