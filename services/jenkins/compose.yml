# Jenkins controller（M1）：CI 构建推 GHCR，部署按 digest 拉取；不发布宿主端口。
# 镜像默认值里的 @sha256:<64hex> 由 CI（build-images.yml fill-pending）回填，禁止手填；
# digest 已由 CI 回填（见 tests/images.lock）。切换镜像源只改 IMAGE_JENKINS 环境变量
# （ghcr.io ↔ ghcr.nju.edu.cn 同 digest），不改本文件。
services:
  jenkins:
    image: ${IMAGE_JENKINS:-ghcr.io/zeek-zhao/orgflow-devops/m1-jenkins@sha256:459b0d97db97151bb836de88e9b68268ac059c9f188e1d5a4ad8951653643dfa}
    pull_policy: missing
    container_name: ${CONTAINER_PREFIX:-of}-jenkins
    labels:
      org.of.fp: ${FP_VALUE:-}
    environment:
      # 前缀路由：Jenkins 自带 --prefix=/jenkins，Caddy handle（非 handle_path）保留路径
      JENKINS_OPTS: --prefix=/jenkins
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Djava.util.logging.config.file=/var/jenkins_home/logging.properties -Xmx1g -Xms512m
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc/jenkins.yaml
      # T9.6：JENKINS_URL 由 PUBLIC_HOST 派生，避免与 defaults.env 的 JENKINS_URL 双处硬编码。
      # defaults.env 的 JENKINS_URL 保留仅作 fallback（供脚本读取），此处为 compose 实际值。
      JENKINS_URL: https://${PUBLIC_HOST}/jenkins/
      # 插件源固定官方（避免镜像站点漂移导致装不上/升级失败）
      JENKINS_UC: https://updates.jenkins.io
      JENKINS_UC_DOWNLOAD: https://updates.jenkins.io/download
      # LDAP 管理员口令（JCasC managerPasswordSecret）：沿用 ldap 服务的 LDAP_PASSWORD 默认值
      LDAP_ADMIN_PASSWORD: ${LDAP_PASSWORD:-change-me}
      # agent SSH 私钥 / host key 公钥：由 up.sh 从 secrets/ 注入（见 T9.1）；
      # 缺省空值只为让 compose 解析通过，缺值由 up.sh 拦截（不进仓库、不进 .env）。
      JENKINS_AGENT_SSH_KEY: ${JENKINS_AGENT_SSH_KEY:-}
      JENKINS_AGENT_HOST_KEY: ${JENKINS_AGENT_HOST_KEY:-}
      TZ: Asia/Shanghai
    volumes:
      - jenkins_home:/var/jenkins_home
      # JCasC 配置与 Job DSL 目录整目录只读挂载（jobs/*.groovy 需进容器）
      - ../../config/jenkins:/var/jenkins_home/casc:ro
      # 流水线逻辑挂载（Job DSL 内联 script(new File(...)) 方案需要）
      - ../../ci:/opt/orgflow/ci:ro
    expose:
      - "8080"
    # 启动顺序（ldap 就绪 → jenkins → agent）由 services/manifest.tsv 的 depends_on
    # 列 + up.sh 保证（per-service compose 不能跨文件 depends_on）。
    dns:
      - ${IP_DNSMASQ}
    networks:
      orgflow:
        ipv4_address: ${IP_JENKINS:-192.168.90.16}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/jenkins/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  jenkins_home:
    external: true
    name: ${JENKINS_HOME_VOLUME:-orgflow-minimal_jenkins_home}

networks:
  orgflow:
    external: true
    name: ${ORG_NETWORK:-orgflow-minimal_orgflow}
