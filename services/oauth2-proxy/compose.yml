# oauth2-proxy：只保护 docs 站点（#86 选项 1）
#
# 认证域名与业务域名分离：浏览器侧走 https://auth.<domain>，服务端到服务端
# （redeem / jwks）走容器网络，避免绕公网。
#
# 组授权：仅 docs-users 组成员可完成登录；非组成员即使 Dex 认证成功也被拒。
# X-Forwarded-* 伪造防护（#86）：上游 oauth2-proxy 至 v7.9.0 均无 --trusted-proxy-ip，
# 实际防线是网络隔离 —— 4180 只 expose 不发布端口，宿主与局域网路由不到。
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0@sha256:dcb6ff8dd21bf3058f6a22c6fa385fa5b897a9cd3914c88a2cc2bb0a85f8065d # lock: oauth2proxy
    container_name: of-oauth2
    restart: unless-stopped
    command:
      - --http-address=0.0.0.0:4180
      - --provider=oidc
      - --client-id=${OAUTH2_CLIENT_ID}
      - --client-secret=${OAUTH2_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_COOKIE_SECRET}
      - --oidc-issuer-url=https://dex.${GATEWAY_DOMAIN}/dex
      - --skip-oidc-discovery=true
      - --login-url=https://dex.${GATEWAY_DOMAIN}/dex/auth
      - --redeem-url=http://dex:5556/dex/token
      - --oidc-jwks-url=http://dex:5556/dex/keys
      - --insecure-oidc-skip-issuer-verification=true
      - --upstream=static://202
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --cookie-secure=true
      # cookie 收窄到 docs 单域：网关只守文档站，不再全域通吃
      - --cookie-domain=docs.${GATEWAY_DOMAIN}
      - --cookie-refresh=1h
      - --whitelist-domain=.${GATEWAY_DOMAIN}
      # 回调按请求 host 推导（docs 域发起就回 docs 域，cookie 才落对域）；
      # 固定 --redirect-url 会把 cookie 钉在 auth 域造成跨域拒收，故不设。
      - --ping-path=/ping
      - --allowed-group=docs-users
      - --email-domain=${EMAIL_DOMAIN}
      - --skip-provider-button=true
    expose:
      - "4180"
    depends_on:
      dex:
        condition: service_healthy
      dnsmasq:
        condition: service_healthy
    dns:
      - ${IP_DNSMASQ}
    networks:
      orgflow:
        ipv4_address: ${IP_OAUTH2_PROXY}
    healthcheck:
      test: ["CMD", "/bin/oauth2-proxy", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
