# certs-init —— 一次性证书签发容器（exit 0，非常驻）
# M2.5 P1-1：改用本仓独立 Dockerfile（ubuntu:24.04 + openssl）构建的 ctx tag，不再复用 router。
services:
  certs-init:
    image: ${IMAGE_CERTS_INIT:-ghcr.io/zeek-zhao/orgflow-devops/m1-certs-init:ctx-f993d91e2ffc}
    pull_policy: never
    container_name: ${CONTAINER_PREFIX:-of}-certs-init
    labels:
      org.of.fp: ${FP_VALUE:-}
    environment:
      DOMAIN: ${DOMAIN:-org-devops.local}
      CA_DIR: /ca
    volumes:
      - ca-data:/ca
      - ./gen-ca.sh:/gen-ca.sh:ro
    entrypoint: ["/bin/bash", "/gen-ca.sh"]
    restart: "no"

volumes:
  ca-data:
    external: true
    name: ${CA_DATA_VOLUME:-orgflow-minimal_ca-data}
