# certs-init —— 一次性证书签发容器（exit 0，非常驻）
services:
  certs-init:
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/certs-init@sha256:21656428b1a6a702700542cd94b9e44eadeeddda3ca88ad5fca8e7dadc416e3c
    container_name: of-certs-init
    build:
      context: services/certs-init
    environment:
      DOMAIN: ${DOMAIN:-org-devops.local}
      CA_DIR: /ca
    volumes:
      - ca-data:/ca
    restart: "no"

volumes:
  ca-data:
