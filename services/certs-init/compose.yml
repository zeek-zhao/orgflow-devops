# certs-init —— 一次性证书签发容器（exit 0，非常驻）
# 复用 main CI 产物 router:24.04-v1（含 openssl/bash），挂载 gen-ca.sh 执行，本仓不自建。
services:
  certs-init:
    image: ${IMAGE_CERTS_INIT:-ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/router@sha256:e5fd71d1cd7cec5068a24ce1165e35587856e2cafe7ca2e772a3b50944f9fe87}
    pull_policy: never
    container_name: ${CONTAINER_PREFIX:-of}-certs-init
    labels:
      org.of.fp: ${FP_VALUE:-}
    environment:
      DOMAIN: ${DOMAIN:-org-devops.local}
      CA_DIR: /ca
    volumes:
      - ca-data:/ca
      - ./gen-ca.sh:/gen-ca.sh:ro
    entrypoint: ["/bin/bash", "/gen-ca.sh"]
    restart: "no"

volumes:
  ca-data:
    external: true
    name: ${CA_DATA_VOLUME:-orgflow-minimal_ca-data}
