# ldapadmin：phpLDAPadmin，目录的 Web 管理界面
#
# 自带 LDAP 登录（#86 起不在网关后面挂 oauth2）：用 cn=admin,<base_dn> + ldap.password 登录。
services:
  ldapadmin:
    image: osixia/phpldapadmin:0.9.0@sha256:d112b82be1336f91e028b0348755133fda333992355b533419355a65c32ff9ad # lock: ldapadmin
    container_name: of-ldapadmin
    restart: unless-stopped
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=ldap
      - PHPLDAPADMIN_HTTPS=false
    expose:
      - "80"
    depends_on:
      dnsmasq:
        condition: service_healthy
    dns:
      - ${IP_DNSMASQ}
    networks:
      orgflow:
        ipv4_address: ${IP_LDAPADMIN}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://localhost/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
