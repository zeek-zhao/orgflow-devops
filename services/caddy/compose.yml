# caddy 唯一入口：隔离端口 8080/8443，固定 IP .10，挂 CA 卷
# 官方 caddy:2 镜像（main 同款），静态 Caddyfile 挂载，本仓不自建。
services:
  caddy:
    image: ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/mirror-caddy@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    container_name: of-caddy
    environment:
      DOMAIN: ${DOMAIN:-org-devops.local}
      PUBLIC_PORT: ${PUBLIC_PORT:-18081}
    ports:
      - "${P_CADDY_HTTP:-8080}:80"
      - "${P_CADDY_HTTPS:-8443}:443"
      - "2019:2019"
      - "${PUBLIC_PORT:-18081}:18081"
    volumes:
      - ../../config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ca-data:/ca:ro
    networks:
      orgflow:
        ipv4_address: ${IP_CADDY:-192.168.90.10}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://192.168.90.10:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ca-data:
    external: true
    name: ${CA_DATA_VOLUME:-orgflow-minimal_ca-data}
networks:
  orgflow:
    external: true
    name: ${ORG_NETWORK:-orgflow-minimal_orgflow}
