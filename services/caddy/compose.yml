# caddy：唯一对外发布端口的服务（80/443）
#
# 证书：仓库自带的 orgflow 内部 CA，不是 Caddy 自签的 local CA。
#   根证书 config/ca/orgflow-ca.crt 入库 → 有效期固定 2036 年、不随 `down -v` 变化；
#   CA 私钥与叶子证书在 secrets/ca/（不进 git），缺文件时 scripts/20-gen-ca.sh 重新生成
#   CA，scripts/lib/site_certs.py 给每个子域现签。
#
# 站点配置由 router 渲染到 out/Caddyfile；本服务只负责执行它。
services:
  caddy:
    image: caddy:2@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e # lock: caddy
    container_name: of-caddy
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT}:80"
      - "${GATEWAY_HTTPS_PORT}:443"
    volumes:
      - ../../out:/etc/caddy
      # 叶子证书来自命名卷 ca_sites（router 用 scripts/lib/site_certs.py 现签的
      # /certs/sites/<子域>.crt|key），**挂到 /certs/sites**而不是 /certs：
      # /certs 整卷只读时，再往它下面挂根证书会报
      #   error mounting ... at "/certs/orgflow-ca.crt": read-only file system
      # （挂一点会先创建挂载点，只读卷里建不了）。
      - ca_sites:/certs/sites:ro
      # 根证书是入库的那一份，只读挂成 /certs/orgflow-ca.crt；CA 私钥不进这个容器。
      - ../../config/ca/orgflow-ca.crt:/certs/orgflow-ca.crt:ro
      # 文档站静态内容：由 services/docs 生成的站点目录（compose 同名卷）
      - docs_site:/srv/docs:ro
      - caddy_data:/data
    depends_on:
      certs-init:
        condition: service_completed_successfully
      router:
        condition: service_healthy
      dnsmasq:
        condition: service_healthy
    dns:
      - ${IP_DNSMASQ}
    networks:
      orgflow:
        ipv4_address: ${IP_CADDY}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
