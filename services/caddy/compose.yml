# caddy 唯一入口：隔离端口 8080/8443，固定 IP .10，挂 CA 卷
# 官方 caddy:2 镜像（main 同款），静态 Caddyfile 挂载，本仓不自建。
services:
  caddy:
    image: ${IMAGE_CADDY:-ghcr.nju.edu.cn/zeek-zhao/orgflow-devops/mirror-caddy@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e}
    pull_policy: never
    container_name: ${CONTAINER_PREFIX:-of}-caddy
    labels:
      org.of.fp: ${FP_VALUE:-}
    environment:
      DOMAIN: ${DOMAIN:-org-devops.local}
      PUBLIC_PORT: ${PUBLIC_PORT:-18081}
      # M2.1：Caddyfile 的 :{$PUB_HTTP_GERRIT} / :{$P_GERRIT_HTTP} 占位符由此注入
      PUB_HTTP_GERRIT: ${PUB_HTTP_GERRIT:-18085}
      P_GERRIT_HTTP: ${P_GERRIT_HTTP:-8080}
    ports:
      - "${P_CADDY_HTTP:-8080}:80"
      - "${P_CADDY_HTTPS:-8443}:443"
      - "127.0.0.1:2019:2019"
      - "${PUBLIC_PORT:-18081}:18081"
      # M2.1：Gerrit 专用回环口（Funnel :8443 回源目标），只绑 127.0.0.1
      - "127.0.0.1:${PUB_HTTP_GERRIT:-18085}:${PUB_HTTP_GERRIT:-18085}"
      # TODO(M2.2)：Harbor 回环口，待 harbor-portal 起来后取消注释
      # - "127.0.0.1:${PUB_HTTP_HARBOR:-18086}:${PUB_HTTP_HARBOR:-18086}"
    volumes:
      - ../../config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ca-data:/ca:ro
    networks:
      orgflow:
        ipv4_address: ${IP_CADDY:-192.168.90.10}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://${IP_CADDY:-192.168.90.10}:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ca-data:
    external: true
    name: ${CA_DATA_VOLUME:-orgflow-minimal_ca-data}
networks:
  orgflow:
    external: true
    name: ${ORG_NETWORK:-orgflow-minimal_orgflow}
