      - M0-B · 流水线与交付（REQ-M0-B*）: requirements/M0-B-流水线与交付.md
      - M0-C · 呈现与文档（REQ-M0-C*）: requirements/M0-C-呈现与文档.md
      - M0-D · 底座与运维（REQ-M0-D*）: requirements/M0-D-底座与运维.md
      - 需求与验收: requirements/README.md
  - 服务手册:
      - 服务手册: services/README.md
      - caddy: services/caddy.md
      - dex: services/dex.md
      - dnsmasq: services/dnsmasq.md
      - docs —— 在线文档站（MkDocs Material）: services/docs.md
      - homepage: services/homepage.md
      - jenkins-agent: services/jenkins-agent.md
      - jenkins: services/jenkins.md
      - ldap: services/ldap.md
      - ldapadmin: services/ldapadmin.md
      - nexus: services/nexus.md
      - oauth2-proxy: services/oauth2-proxy.md
