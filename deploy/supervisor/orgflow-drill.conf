; OrgFlow 隔离恢复演练守护服务（M3.0.2 T4）：常驻进程，每本地周日 04:00 跑 drill-up.sh + 启动 26h 补跑。
; __REPO__ 由安装目标 sed 渲染为仓库绝对路径。
; 与 backup 守护同机制：PID1=supervisord，autorestart=true 负责拉起；
; 脚本内 /run/orgflow-drill.pid + flock 做单实例，重复实例 exit 4。
[program:orgflow-drill]
command=/bin/bash __REPO__/scripts/drill-daemon.sh run
directory=__REPO__
autostart=true
autorestart=true
startsecs=0
startretries=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/orgflow/drill.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

; 看护进程：沙箱云 IDE supervisord 对动态 program 的 autorestart 实测不触发，
; 故默认启用 watchdog 做等价兜底（每 10s 巡检 /run/orgflow-drill.pid，死了 nohup 拉起）。
; 真机 supervisor autorestart 可靠时，可设 DRILL_WATCHDOG_AUTOSTART=false 关闭，避免双实例。
[program:orgflow-drill-watchdog]
command=/bin/bash __REPO__/scripts/drill-watchdog.sh
directory=__REPO__
autostart=__DRILL_WATCHDOG_AUTOSTART__
autorestart=true
startsecs=0
stdout_logfile=/var/log/orgflow/drill-watchdog.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true
