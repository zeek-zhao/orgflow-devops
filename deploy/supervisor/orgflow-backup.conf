; OrgFlow 备份守护服务（M3.0.1 T1）：常驻进程，每本地 03:30 备份 + 启动补跑 + 保留轮转。
; __REPO__ 由安装目标 sed 渲染为仓库绝对路径。
; 与 quota 守护同机制：PID1=supervisord，autorestart=true 负责 kill -9 后 15s 内拉起；
; 脚本内 /run/orgflow-backup.pid + flock 做单实例，重复实例 exit 4。
[program:orgflow-backup]
command=/bin/bash __REPO__/scripts/backup-daemon.sh run
directory=__REPO__
autostart=true
autorestart=true
startsecs=0
startretries=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/orgflow/backup.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
environment=BACKUP_ROOT="/data/backups"

; 看护进程：沙箱云 IDE supervisord 对动态 program 的 autorestart 实测不触发，
; 故默认启用 watchdog 做等价兜底（每 10s 巡检 /run/orgflow-backup.pid，死了 nohup 拉起）。
; 真机 supervisor autorestart 可靠时，可设 BACKUP_WATCHDOG_AUTOSTART=false 关闭，避免双实例。
[program:orgflow-backup-watchdog]
command=/bin/bash __REPO__/scripts/backup-watchdog.sh
directory=__REPO__
autostart=__BACKUP_WATCHDOG_AUTOSTART__
autorestart=true
startsecs=0
stdout_logfile=/var/log/orgflow/backup-watchdog.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true
