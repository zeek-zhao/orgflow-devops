; OrgFlow 配额证据刷新服务（m2.5.3 P0-1 / m2.5.4 P0-1 单实例）
; __REPO__ 由 make quota-supervisor-install 用 sed 渲染为仓库绝对路径。
; __WATCHDOG_AUTOSTART__ 由安装目标按 WATCHDOG=1/0 渲染为 true/false（默认 false）。
; 真机 supervisor autorestart=true 足以拉起 loop，watchdog 必须关（否则双实例）；
; 仅无 supervisorctl / autorestart 失效的沙箱才显式 WATCHDOG=1 打开 watchdog。
[program:orgflow-quota]
command=/bin/bash __REPO__/scripts/quota-guard-loop.sh
directory=__REPO__
autostart=true
autorestart=true
startsecs=0
startretries=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=__REPO__/artifacts/quota/supervisor.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
environment=QUOTA_MECHANISM="supervisor"

; 看护进程：默认不启用（autostart=false）。真机 supervisor 自己就会重启 loop，
; 若 watchdog 同时启用，会在"supervisor 杀旧进程到拉起新进程"的间隙看到 pidfile 失效而
; 再 nohup 拉一个 loop → 双实例双写。仅当 autorestart 实测失效（本沙箱云 IDE）时，
; 安装目标显式 WATCHDOG=1 才会把下面 autostart 渲染为 true。
[program:orgflow-quota-watchdog]
command=/bin/bash __REPO__/scripts/quota-watchdog.sh
directory=__REPO__
autostart=__WATCHDOG_AUTOSTART__
autorestart=true
startsecs=0
stdout_logfile=__REPO__/artifacts/quota/watchdog.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
