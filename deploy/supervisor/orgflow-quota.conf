; OrgFlow 配额证据刷新服务（m2.5.3 P0-1；PID1=supervisord 主机）
; __REPO__ 由 make quota-supervisor-install 用 sed 渲染为仓库绝对路径。
[program:orgflow-quota]
command=/bin/bash __REPO__/scripts/quota-guard-loop.sh
directory=__REPO__
autostart=true
autorestart=true
startsecs=0
startretries=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=__REPO__/artifacts/quota/supervisor.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
environment=QUOTA_MECHANISM="supervisor"

; 看护进程：真机 supervisor autorestart 足以拉起 orgflow-quota；本 program 作为额外兜底，
; 每 10s 检查 loop 的 daemon.pid，死了就拉起（防止动态加入的 program 在个别 supervisord 实现下不 autorestart）。
[program:orgflow-quota-watchdog]
command=/bin/bash __REPO__/scripts/quota-watchdog.sh
directory=__REPO__
autostart=true
autorestart=true
startsecs=0
stdout_logfile=__REPO__/artifacts/quota/watchdog.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
