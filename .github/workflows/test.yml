name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连推时取消上一次（#53）。Test 是这套栈唯一的真验证，不做路径跳过；
# 但「结论已经过期的那一轮」没有跑完的必要 —— 每次 DinD 都要吃掉好几分钟额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 必须全量：浅克隆下 PR 合成合并提交会被 git 视为"无父提交"，
          # identity-check 的 --no-merges 就过滤不掉它（详见 CONTRIBUTING.md）
          fetch-depth: 0
      - name: 提交身份校验
        run: make identity-check
      - run: make test
      - name: Run bats in DinD
        # bats 只测本地构建（Makefile 的 TEST_BATS_GHCR 缺省 0，且不跟随 USE_GHCR）：
        # CI 要验证的是**本次提交的源码**能不能起得来，GHCR 上是上一个提交的镜像。
        # 托管 runner 可出网，构建 + 拉 Hub 都允许。
        run: |
          set -o pipefail
          ALLOW_PULL_DOCKER_HUB=1 make test-bats 2>&1 | tee /tmp/bats-run.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: bats-failure-log
          path: /tmp/bats-run.log
          if-no-files-found: warn
