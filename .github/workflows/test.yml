name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连推时取消上一次（#53）。Test 是这套栈唯一的真验证，不做路径跳过；
# 但「结论已经过期的那一轮」没有跑完的必要 —— 每次 DinD 都要吃掉好几分钟额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须全量：浅克隆下 PR 合成合并提交会被 git 视为"无父提交"，
          # identity-check 的 --no-merges 就过滤不掉它（详见 docs/提交规范.md）
          fetch-depth: 0
      - name: 提交身份校验
        run: make identity-check
      - run: make test
      - name: Run bats in DinD
        run: |
          set -o pipefail
          ALLOW_PULL_DOCKER_HUB=1 make test-bats 2>&1 | tee /tmp/bats-run.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bats-failure-log
          path: /tmp/bats-run.log
          if-no-files-found: warn
