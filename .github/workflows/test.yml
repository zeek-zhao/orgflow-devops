name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 提交身份校验
        run: make identity-check
      - run: make test
      - name: Run bats in DinD
        run: |
          set -o pipefail
          ALLOW_PULL_DOCKER_HUB=1 make test-bats 2>&1 | tee /tmp/bats-run.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bats-failure-log
          path: /tmp/bats-run.log
          if-no-files-found: warn
