name: Mirror M2 Images to GHCR

# M2.1：Gerrit 官方镜像（gerritcodereview/gerrit）在国内被墙、加速站大层反复 TLS 超时。
# 借 GitHub runner 的海外网络拉取官方镜像并原样中转推 GHCR；cgit 自建镜像同流水线构建推送。
# 本地经 ghcr.nju.edu.cn 代理下载（README §镜像与供应链的同款链路）。
#
# 触发方式：push（仅镜像相关路径变更）或 workflow_dispatch 手动。
# API dispatch 按默认分支找 workflow，本文件只在 feat/m2 分支故用 push 触发。
# 推完需确认两个包为 Public（仓库公开 ≠ 包公开，否则代理匿名 pull 401/403）。

on:
  push:
    branches: [feat/m2-gerrit-cgit-harbor]
    paths:
      - ".github/workflows/mirror-m2.yml"
      - "services/gerrit/**"
      - "services/cgit/**"
      - "services/registry/**"
      - "scripts/image-hash.sh"
      - "tests/images.lock"
      - "config/images.env"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-m2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # M2.5 P1-1：gerrit 部署镜像已改由 build-images.yml 用本仓 Dockerfile（FROM 官方 digest）
      # 构建推 ctx tag。此处中转的裸 3.9.0 仅作上游基底兜底/摘要核验，不再作为部署引用。
      - name: 拉取 Gerrit 官方镜像 → 中转推 GHCR（仅作 FROM 基底兜底）
        id: gerrit
        run: |
          set -euo pipefail
          REF="gerritcodereview/gerrit:3.9.0"
          GHCR="ghcr.io/zeek-zhao/orgflow-devops/m2-gerrit:3.9.0"
          echo "::group::docker pull $REF"
          docker pull "$REF"
          echo "::endgroup::"
          # 上游 manifest digest（RepoDigests 的 @sha256 部分）：回填 UPSTREAM_GERRIT / images.lock
          RD="$(docker image inspect "$REF" --format '{{index .RepoDigests 0}}')"
          UP="${RD#*@}"
          echo "upstream_digest=$UP" >> "$GITHUB_OUTPUT"
          docker tag "$REF" "$GHCR"
          docker push "$GHCR"
          GHRD="$(docker image inspect "$GHCR" --format '{{index .RepoDigests 0}}')"
          echo "ghcr_digest=${GHRD#*@}" >> "$GITHUB_OUTPUT"
          printf 'gerrit upstream=%s ghcr=%s\n' "$UP" "${GHRD#*@}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 构建并推 cgit 自建镜像（内容 tag）
        id: cgit
        run: |
          set -euo pipefail
          # image-hash.sh 的 sort 排序受 locale 影响：runner 默认 C locale 会把
          # Dockerfile 排在 cgitrc 前，算出与本地 en_US.UTF-8 不同的 tag。
          # 必须与部署端（lock/compose）口径一致，否则拉不到镜像。
          export LC_ALL=en_US.UTF-8
          locale -a | grep -qi '^en_US\.utf8$' || sudo locale-gen en_US.UTF-8
          HASH="$(bash scripts/image-hash.sh cgit)"
          TAG="ctx-${HASH:0:12}"
          GHCR="ghcr.io/zeek-zhao/orgflow-devops/m2-cgit:$TAG"
          echo "cgit 期望 tag=$TAG（contextSha256=$HASH）" | tee -a "$GITHUB_STEP_SUMMARY"
          docker build -t "$GHCR" services/cgit
          docker push "$GHCR"
          GHRD="$(docker image inspect "$GHCR" --format '{{index .RepoDigests 0}}')"
          printf 'cgit tag=%s ghcr=%s\n' "$TAG" "${GHRD#*@}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 构建并推 registry:2 薄封装（M2.2，内容 tag）
        id: registry
        run: |
          set -euo pipefail
          export LC_ALL=en_US.UTF-8
          locale -a | grep -qi '^en_US\.utf8$' || sudo locale-gen en_US.UTF-8
          REF="registry:2"
          echo "::group::docker pull $REF"
          docker pull "$REF"
          echo "::endgroup::"
          # 上游 manifest digest（RepoDigests）：回填 UPSTREAM_REGISTRY / images.lock / Dockerfile / 登记表
          RD="$(docker image inspect "$REF" --format '{{index .RepoDigests 0}}')"
          UP="${RD#*@}"
          echo "upstream_digest=$UP" >> "$GITHUB_OUTPUT"
          # image-hash.sh 口径基于 Dockerfile 文本（ARG BASE_DIGEST 默认值固定），tag 稳定。
          HASH="$(bash scripts/image-hash.sh registry)"
          TAG="ctx-${HASH:0:12}"
          GHCR="ghcr.io/zeek-zhao/orgflow-devops/m2-registry:$TAG"
          echo "registry upstream=$UP 期望 tag=$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          # M2.2 P2-2：Dockerfile 用 ARG BASE_DIGEST（默认值=已验证真实 digest，仓库可直接 build）。
          # CI 用 --build-arg 注入当日实拉 digest，不再 sed 改文件——仓库内容与构建输入一致。
          docker build --build-arg BASE_DIGEST="$UP" -t "$GHCR" services/registry
          docker push "$GHCR"
          GHRD="$(docker image inspect "$GHCR" --format '{{index .RepoDigests 0}}')"
          printf 'registry tag=%s ghcr=%s\n' "$TAG" "${GHRD#*@}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 汇总
        run: |
          {
            echo "## M2 镜像镜像结果"
            echo "- gerrit upstream digest: \`${{ steps.gerrit.outputs.upstream_digest }}\`"
            echo "- gerrit GHCR digest: \`${{ steps.gerrit.outputs.ghcr_digest }}\`"
            echo "- gerrit 部署镜像：ghcr.io/zeek-zhao/orgflow-devops/m2-gerrit:ctx-<12（由 build-images.yml 构建；裸 3.9.0 仅 FROM 基底）"
            echo "- 包地址：ghcr.io/zeek-zhao/orgflow-devops/m2-cgit:<ctx tag，见上>"
            echo "- registry upstream digest: \`${{ steps.registry.outputs.upstream_digest }}\`"
            echo "- 包地址：ghcr.io/zeek-zhao/orgflow-devops/m2-registry:ctx-<12，见上>"
          } >> "$GITHUB_STEP_SUMMARY"
