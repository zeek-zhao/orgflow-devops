name: Secret Scan

# 密钥扫描：只跑定时与手动，不挂在每次 push 上。
# 理由：私有仓 Actions 额度已超支（#129，11 月用了 11,318 分钟 / 免费 2,000），
# 而全历史扫描的增量价值主要来自「历史新出现的泄漏」，每周一次足够。
# 公开仓那边（compliance.yml）是免费额度，所以每次 push 都扫。
on:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks（全历史）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0        # 关键：不取全历史，--log-opts=--all 也扫不到东西
      - uses: gacts/gitleaks@4fd785dcdaf557fda64e05b0ae033b8f7d82fb81 # v1
        with:
          # 与 compliance.yml 同一套口径：豁免清单在仓根 .gitleaks.toml，显式指定。
          args: --config .gitleaks.toml --redact --verbose --log-opts=--all
