name: Secret Scan

# 密钥扫描：只跑定时与手动，不挂在每次 push 上。
# 理由：私有仓 Actions 额度已超支（#129，11 月用了 11,318 分钟 / 免费 2,000），
# 而全历史扫描的增量价值主要来自「历史新出现的泄漏」，每周一次足够。
# 公开仓那边（compliance.yml）是免费额度，所以每次 push 都扫。
on:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks（全历史）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 关键：不取全历史，--log-opts=--all 也扫不到东西
      - uses: gacts/gitleaks@v1
        with:
          args: --redact --verbose --log-opts=--all
