name: Images

# 只构建「改动真正落进去」的镜像（#53）。以前 matrix 是全量的：改一个
# tools/jenkins-agent/Dockerfile 也会把 jenkins / jjb / router / dnsmasq / m0-test
# 白建一遍，2026-10-31 一天在本仓库烧掉 631 分钟免费额度，大半是这么来的。

on:
  push:
    branches: [main]
    paths:
      - tests/harness/**
      - services/router/**
      - services/dnsmasq/**
      - services/jenkins/**
      - tools/jjb/**
      - tools/jenkins/**
      - tools/jenkins-agent/**
      - .github/workflows/images.yml
      - .github/scripts/**
  pull_request:
    paths:
      - tests/harness/**
      - services/router/**
      - services/dnsmasq/**
      - services/jenkins/**
      - tools/jjb/**
      - tools/jenkins/**
      - tools/jenkins-agent/**
      - .github/workflows/images.yml
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 同一分支连推时取消上一次（PR 上取消是安全的：结论已经过期）。
# main 上不取消，避免打断正在推 GHCR 的构建。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: 算出要构建的镜像
    runs-on: ubuntu-24.04
    outputs:
      any: ${{ steps.pick.outputs.any }}
      matrix: ${{ steps.pick.outputs.matrix }}
      images: ${{ steps.pick.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 要 diff 出改动范围，浅克隆不够
          fetch-depth: 0
      - id: pick
        name: 裁剪 matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          # 判断不了影响范围就全量：多建一轮是浪费，漏建一轮是事故。
          fallback_full() {
            # ::warning:: 是工作流命令，必须走 stdout 才会被 runner 解析成注解
            echo "::warning::$1；退化为全量构建"
            bash .github/scripts/select-images.sh --all
          }
          case "$EVENT_NAME" in
            workflow_dispatch)
              bash .github/scripts/select-images.sh --all
              ;;
            pull_request)
              if list="$(git diff --name-only --no-renames "${BASE_SHA:-}...${HEAD_SHA:-}")"; then
                printf '%s\n' "$list" | bash .github/scripts/select-images.sh
              else
                fallback_full "算不出 PR 的改动范围"
              fi
              ;;
            *)
              if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" == "$zero" ]] \
                 || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                fallback_full "新分支或拿不到推送前的提交"
              elif list="$(git diff --name-only --no-renames "$BEFORE_SHA" "${HEAD_SHA:-}")"; then
                printf '%s\n' "$list" | bash .github/scripts/select-images.sh
              else
                fallback_full "算不出本次推送的改动范围"
              fi
              ;;
          esac
      - name: 记录裁剪结果
        if: always()
        env:
          ANY: ${{ steps.pick.outputs.any }}
          IMAGES: ${{ steps.pick.outputs.images }}
        run: |
          if [[ "$ANY" == "true" ]]; then
            echo "本次构建：\`${IMAGES}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "本次不构建任何镜像（改动没有落在任何镜像上下文里）" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: select
    # 空 matrix 会让 GitHub 报 "Matrix vector 'include' does not contain any values"，
    # 所以没有任何镜像要建时必须用 if 跳过整个 job，不能给空 include。
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=24.04-v1
            ${{ matrix.image == 'jenkins' && 'type=raw,value=24.04-v3' || '' }}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s %s\n' "$IMAGE" "$DIGEST" | tee digests.txt >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo 'Build only; this digest was not published.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: digests.txt
          if-no-files-found: error

  digests:
    needs: [select, build]
    # 只建了一部分镜像时，这里只汇总建过的那几个；未改动的镜像 digest 不会变，
    # scripts/pin-images.sh 照旧从 registry 回写，不依赖这份汇总的完整性。
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
      - name: Combine matrix digests
        run: cat digests/*/digests.txt | sort | tee digests.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digests.txt
          path: digests.txt
          if-no-files-found: error
