name: Images

on:
  push:
    branches: [main]
    paths:
      - tests/harness/**
      - services/router/**
      - services/dnsmasq/**
      - tools/jjb/**
      - tools/jenkins/**
      - tools/jenkins-agent/**
      - .github/workflows/images.yml
  pull_request:
    paths:
      - tests/harness/**
      - services/router/**
      - services/dnsmasq/**
      - tools/jjb/**
      - tools/jenkins/**
      - tools/jenkins-agent/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: router
            context: services/router
          - image: jjb
            context: tools/jjb
          # Jenkins 从「mirror 上游」改成「自建」：上游镜像不带插件，
          # 而 213 拉不到 Docker Hub，只能在 runner 上构建后推 GHCR（#44）。
          - image: jenkins
            context: tools/jenkins
          # agent 同理：底座在 Docker Hub，213 拉不到，只能 runner 上构建后推 GHCR。
          - image: jenkins-agent
            context: tools/jenkins-agent
          - image: m0-test
            context: tests/harness
          - image: dnsmasq
            context: services/dnsmasq
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=24.04-v1
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s %s\n' "$IMAGE" "$DIGEST" | tee digests.txt >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo 'Build only; this digest was not published.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: digests.txt
          if-no-files-found: error

  digests:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
      - name: Combine matrix digests
        run: cat digests/*/digests.txt | sort | tee digests.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digests.txt
          path: digests.txt
          if-no-files-found: error
