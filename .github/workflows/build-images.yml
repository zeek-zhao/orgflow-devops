name: Verify Image Pins

# 2026-11-24 改版（Issue #194）：镜像全部对齐 main 分支同款（官方 mirror-* 原样搬运
# + main CI 产物），本仓不再基于 ubuntu 自建镜像，因此不再有 build/push job。
# 本 workflow 改为「镜像 pin 校验」：确认 config/images.env 引用的每个 digest
# 在 GHCR（public）真实存在且可拉取，防止手改 lock 写进一个不存在的 sha256。
# 真正的镜像构建由 main 的 .github/workflows/images.yml 与 mirror.yml 负责。

on:
  push:
    branches: [main, "feat/m0-minimal", "feat/m0-adopt-main-images"]
    paths:
      - "config/images.env"
      - "tests/images.lock"
      - ".github/workflows/build-images.yml"
  pull_request:
    paths:
      - "config/images.env"
      - "tests/images.lock"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pins:
    name: 校验镜像 digest 可拉取
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 校验每个 IMAGE_* 的 digest 在 GHCR 可解析
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          n=0
          while IFS='=' read -r key val; do
            [[ "$key" == IMAGE_* ]] || continue
            # val 形如 ghcr.io/zeek-zhao/orgflow-devops/<pkg>@sha256:<64hex>
            [[ "$val" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "✗ $key 未锁合法 digest: $val" >&2; exit 1; }
            ref="${val//ghcr.nju.edu.cn/ghcr.io}"
            echo "检查 $key -> $ref"
            for i in 1 2 3; do
              docker manifest inspect "$ref" >/dev/null 2>&1 && break
              (( i == 3 )) && { echo "✗ $ref 不可解析" >&2; exit 1; }
              sleep 5
            done
            n=$((n+1))
          done < <(grep -vE '^\s*#|^\s*$' config/images.env)
          echo "✓ $n 个镜像 digest 全部可在 GHCR 解析"
