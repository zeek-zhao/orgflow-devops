name: Build M0/M1 Images

# v1.0 §4 / AC-20：M0 镜像全部在本分支 CI 构建推 GHCR，不引用 main 产物。
# M1 追加 m1-jenkins / m1-jenkins-agent 两项（controller + SSH agent）。
#
# r5 §2：镜像标识改为「内容 tag」——tag 后缀 ctx-<12> = scripts/image-hash.sh <svc> 前 12 位。
#   CI 按内容 tag 产出镜像（compose 直接引用该 tag），已彻底移除旧的回填链路，无回填步骤。
#   构建输入（Dockerfile + COPY 真源文件）一变，哈希与 tag 必变，由 make check 拦截漂移。

on:
  push:
    branches: [feat/m0-v2, feat/m0-final-pr, feat/m0-t2-images, feat/m1-jenkins, main]
    paths:
      - "services/**"
      - "config/Caddyfile"
      - "config/ldap/**"
      - "config/homepage/**"
      - "config/jenkins/**"
      - "ci/**"
      - "scripts/sync-build-context.sh"
      - "scripts/image-hash.sh"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

# GHCR 推送仅当仓库变量 vars.PUSH_IMAGES='true'（有 packages:write 权限）时执行；
# 否则只做 docker build 校验，不因无推送权限而 fail。

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: m0-dnsmasq
            context: services/dnsmasq
            tag: m0-v2
          - image: m0-caddy
            context: services/caddy
            tag: m0-v2
          - image: m0-ldap
            context: services/ldap
            tag: m0-v2
          - image: m0-ldapadmin
            context: services/ldapadmin
            tag: m0-v2
          - image: m0-homepage
            context: services/homepage
            tag: m0-v2
          - image: m0-router
            context: services/router
            tag: m0-v2
          # M1：Jenkins controller 与 SSH agent，部署按内容 tag（ctx-<12>）拉取
          - image: m1-jenkins
            context: services/jenkins
            svc: jenkins
          - image: m1-jenkins-agent
            context: services/jenkins-agent
            svc: jenkins-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 同步自包含构建上下文
        run: bash scripts/sync-build-context.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: 登录 GHCR（仅在允许推送时）
        if: ${{ vars.PUSH_IMAGES == 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 计算内容 tag（r5：M1 用 image-hash.sh 前 12 位，M0 用 m0-v2）
        id: ctag
        env:
          SVC: ${{ matrix.svc }}
        run: |
          if [[ -n "$SVC" ]]; then
            HASH="$(bash scripts/image-hash.sh "$SVC")"
            echo "tag=ctx-${HASH:0:12}" >> "$GITHUB_OUTPUT"
            echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          else
            echo "tag=m0-v2" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ steps.ctag.outputs.tag }}
      - name: 构建镜像（无推送权限时只 build 校验，不 push）
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ${{ matrix.context }}
          push: ${{ vars.PUSH_IMAGES == 'true' }}
          load: ${{ vars.PUSH_IMAGES != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: 输出内容 tag / digest 摘要（r5：仅摘要，不再回填 lock/compose）
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.ctag.outputs.tag }}
        run: |
          printf '%s\ttag=%s\tdigest=%s\n' "$IMAGE" "$TAG" "$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"

  # certs-init 复用本分支重建后的 m0-router，不单独出镜像（v1.0 表格第 2 行）。
  verify-upstream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 上游 digest 登记表一致性（R4a 已并入 check-images.sh）
        run: bash scripts/check-images.sh --mode=upstream
