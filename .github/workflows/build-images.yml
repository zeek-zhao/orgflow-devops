name: Build M0 Images

# v1.0 §4 / AC-20：7 个镜像全部在本分支 CI 构建推 GHCR，不引用 main 产物。
# 构建产物以 m0-<svc> 命名，避免与 main 的同名镜像冲突；digest 由 build job 输出，
# 由 make images-lock 回填到 tests/images.lock（人不手改）。

on:
  push:
    branches: [feat/m0-final-pr, feat/m0-t2-images, main]
    paths:
      - "services/**"
      - "config/Caddyfile"
      - "config/ldap/**"
      - "config/homepage/**"
      - "scripts/sync-build-context.sh"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: m0-dnsmasq
            context: services/dnsmasq
          - image: m0-caddy
            context: services/caddy
          - image: m0-ldap
            context: services/ldap
          - image: m0-ldapadmin
            context: services/ldapadmin
          - image: m0-homepage
            context: services/homepage
          - image: m0-router
            context: services/router
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 同步自包含构建上下文
        run: bash scripts/sync-build-context.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=m0-v1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: 输出 digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s\t%s\n' "$IMAGE" "$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE=$DIGEST" >> digests.env
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.image }}
          path: digests.env

  # certs-init 复用本分支重建后的 m0-router，不单独出镜像（v1.0 表格第 2 行）。
  verify-upstream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 上游 digest 登记表一致性
        run: bash scripts/check-upstream-digest.sh
