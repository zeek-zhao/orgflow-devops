# GHCR 单一来源覆盖层（ADR-12）。
#
# 全部 12 个包都是 public，**拉取不需要 docker login**、不需要任何凭据：
#   docker pull ghcr.io/zeek-zhao/orgflow-devops/router:24.04-v1
# 需要凭据的只有「推」这一侧（.github/workflows/images.yml / mirror.yml）。
#
# 先用 mirror.yml mode=all 填充 mirror-* 包，再跑 images.yml；
# make images-pin 把 router/jjb/dnsmasq/jenkins 与 harness 的 digest 回写到本文件。
services:
  caddy:
    image: ghcr.io/zeek-zhao/orgflow-devops/mirror-caddy:2@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
  # 自建镜像（#44 / #45）：digest 由 `make images-pin` 从 GHCR 回写，不是上游 digest。
  # 上游 jenkins/jenkins 不带插件、也不带 docker CLI，所以这两个都不能再用 mirror-*。
  #
  # #90 / REQ-M0-B1：新插件镜像（services/jenkins/，比上一版多 ldap 等）按「新增 tag」
  # 登记为 24.04-v2，digest 记在 tests/images.lock。本轮只提交源码、不构建不推送，
  # 24.04-v2 还没有真实 digest，lock 里是明确的「待构建后回填」文字占位，不是伪造的 sha256。
  # 因此这里保持指向已发布、未改动的 24.04-v1@sha256:2e211...（不含 #90 新增插件）。
  # 回填流程：images.yml 构建 24.04-v2 → 把真实 digest 写入 tests/images.lock 和本文件
  # 的 jenkins.image（届时替换 24.04-v1）→ 去掉占位 → 才允许 USE_GHCR=1 make deploy。
  # 占位期间的闸门：tests/images.sh ensure 要求 image 为 @sha256:[a-f0-9]{64}；
  # make check-pins 拦 USE_GHCR=1 的 up/deploy（见 Makefile）。
  jenkins:
    image: ghcr.io/zeek-zhao/orgflow-devops/jenkins:24.04-v3@sha256:ee7dd0022ffe10ac15009a8b27d35c090b36a7fb712090686ede6696fa37ceab
  jenkins-agent:
    image: ghcr.io/zeek-zhao/orgflow-devops/jenkins-agent:24.04-v1@sha256:dd8067a1b1cf5ef7524f024faa37c4e546666ed4143dda877573655b92ebf17d
  ldap:
    image: ghcr.io/zeek-zhao/orgflow-devops/mirror-openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
  ldapadmin:
    image: ghcr.io/zeek-zhao/orgflow-devops/mirror-phpldapadmin:0.9.0@sha256:d112b82be1336f91e028b0348755133fda333992355b533419355a65c32ff9ad
  dex:
    image: ghcr.io/zeek-zhao/orgflow-devops/mirror-dex:v2.41.1@sha256:bc7cfce7c17f52864e2bb2a4dc1d2f86a41e3019f6d42e81d92a301fad0c8a1d
  oauth2-proxy:
    image: ghcr.io/zeek-zhao/orgflow-devops/mirror-oauth2-proxy:v7.6.0@sha256:dcb6ff8dd21bf3058f6a22c6fa385fa5b897a9cd3914c88a2cc2bb0a85f8065d
  # nexus 不在这里（#46）：它已移出 compose，由 job `nexus-deploy` 部署。
  # 镜像仍是 mirror-nexus（213 拉不到 Docker Hub），digest 写在
  # scripts/nexus-deploy.sh 里，并由 scripts/test_jobs.py 与 images.lock 交叉校验。
  # mirror-* 是原样搬运，digest 与上游逐字节相同，所以这里可以直接写死
  homepage:
    image: ghcr.io/zeek-zhao/orgflow-devops/mirror-homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
  router:
    image: ghcr.io/zeek-zhao/orgflow-devops/router:24.04-v1@sha256:405d22a3918ecaa05cb0cfd130e42efc4a70134a9ee4c7b83701a8caa2148ec7
  jjb:
    image: ghcr.io/zeek-zhao/orgflow-devops/jjb:24.04-v1@sha256:87eb51844b29c3ac7a841efff469a04d9c5ccac591b07faa47e01aa163dcf258
  dnsmasq:
    image: ghcr.io/zeek-zhao/orgflow-devops/dnsmasq:24.04-v1@sha256:ea3d1194f4e541fbb836619924407e76061bbf2fbf3beec2412d92e55ee24631

x-m0-test-image: ghcr.io/zeek-zhao/orgflow-devops/m0-test:24.04-v1@sha256:9ddcca1214a5950fa323c3ecfe52bd8545dfa187a470db37e2da0f62ea3f941e
